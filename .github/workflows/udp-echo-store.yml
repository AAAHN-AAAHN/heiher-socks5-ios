name: Finalize restored UDP Echo repository
on:
  push:
    branches: [work/udp-echo-publish-20261028]
permissions:
  contents: read
jobs:
  store:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Select the explicitly declared operation
        id: operation
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          mode = json.loads(Path('Bootstrap/ref-operations.json').read_bytes())['operation']
          if mode not in ('archive', 'store', 'publish', 'dispatch', 'cleanup'):
              raise SystemExit('Unknown repository operation')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('mode=' + mode + '\n')
          PY
      - name: Verify publication and cleanup boundaries without network mutations
        run: python3 -m unittest discover -s Bootstrap -p test_ref_maintenance.py -v
      - name: Verify the bundle and store only exact Git objects
        if: ${{ steps.operation.outputs.mode == 'store' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Bootstrap/store_objects.py
      - name: Verify the exact final candidate objects before publication
        if: ${{ steps.operation.outputs.mode == 'publish' || steps.operation.outputs.mode == 'dispatch' }}
        run: python3 Bootstrap/import_candidates.py
      - name: Apply the exact archive, publication, dispatch or cleanup plan
        if: ${{ steps.operation.outputs.mode != 'store' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Bootstrap/ref_maintenance.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-stored-objects-${{ github.run_id }}
          path: |
            Bootstrap/candidates.json
            Bootstrap/ref-operations.json
            artifacts/candidate-prepare/
            artifacts/candidate-objects/
            artifacts/ref-maintenance/
          if-no-files-found: error
          retention-days: 90
