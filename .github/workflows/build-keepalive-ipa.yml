name: Build SOCKS5 with external traffic statistics

on:
  push:
    branches: [feature/background-keepalive]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_SHA: b3585289622561caf4b8789b436cc8820ecd6be0
  APP_BASE: 672fc5061518f83a387a8cb3b5768f2de9da534a

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heiher/hev-socks5-server
          ref: ${{ env.CORE_SHA }}
          path: core
          submodules: recursive
          persist-credentials: false
      - name: Apply isolated patches
        run: |
          mkdir -p artifacts
          sh app/Tests/apply_traffic_stats.sh
      - name: Check upstream formatting and record canonical patches
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
          python3 - <<'PY'
          import pathlib, subprocess
          for repo, patch in [('core', 'hev-stats-server.patch'),
                              ('core/src/core', 'hev-stats-core.patch'),
                              ('core/third-part/hev-task-system', 'hev-stats-task-io.patch')]:
              # Stage only the existing compatibility change, not the statistics.
              if repo == 'core':
                  subprocess.run(['git', '-C', repo, 'add', 'src/hev-socks5-session.c'], check=True)
              elif repo == 'core/src/core':
                  # Install the known compatibility-only version into the index.
                  base = subprocess.check_output(['git', '-C', repo, 'show', 'HEAD:src/hev-socks5-udp.c'])
                  temp = pathlib.Path('/tmp/stats-base')
                  (temp / 'src').mkdir(parents=True, exist_ok=True)
                  (temp / 'src/hev-socks5-udp.c').write_bytes(base)
                  subprocess.run(['git', '-C', str(temp), 'apply', str(pathlib.Path('app/Patches/hev-udp-sockaddr.patch').resolve())], check=True)
                  blob = subprocess.check_output(['git', '-C', repo, 'hash-object', '-w', str(temp / 'src/hev-socks5-udp.c')]).decode().strip()
                  subprocess.run(['git', '-C', repo, 'update-index', '--cacheinfo', '100644,' + blob + ',src/hev-socks5-udp.c'], check=True)
              paths = subprocess.check_output(['git', '-C', repo, 'diff', '--name-only', '--', '*.c', '*.h']).decode().splitlines()
              for name in paths:
                  p = pathlib.Path(repo) / name
                  before = p.read_bytes()
                  subprocess.run(['clang-format-18', '-i', str(p)], check=True)
                  if before != p.read_bytes():
                      pathlib.Path('artifacts/format-changed').touch()
                      print('FORMAT:', repo, name)
              diff = subprocess.check_output(['git', '-C', repo, 'diff', '--full-index', '--', '*.c', '*.h'])
              pathlib.Path('artifacts', patch).write_bytes(diff)
          PY
      - name: Test buffered and Linux splice paths
        shell: bash
        run: |
          set -euo pipefail
          for flags in '' '-DENABLE_IO_SPLICE_SYSCALL'; do
            mode=buffered
            test -z "$flags" || mode=splice
            (cd core && make -j3 CFLAGS="$flags" static) > "artifacts/linux-$mode-build.log" 2>&1
            cc -std=gnu11 -O2 -Wall -Werror -pthread -Icore/src app/Tests/traffic_stats_host.c \
              core/bin/libhev-socks5-server.a core/third-part/yaml/bin/libyaml.a \
              core/third-part/hev-task-system/bin/libhev-task-system.a -o artifacts/stats-host
            python3 -u app/Tests/traffic_stats_regression.py artifacts/stats-host \
              2> "artifacts/linux-$mode-server.log" | tee "artifacts/linux-$mode-tests.log"
            (cd core && make clean) >> "artifacts/linux-$mode-build.log" 2>&1
          done
          rm artifacts/stats-host
          test ! -e artifacts/format-changed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Traffic-statistics-audit
          path: artifacts/
          retention-days: 14

  build:
    needs: audit
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: app
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heiher/hev-socks5-server
          ref: ${{ env.CORE_SHA }}
          path: core
          submodules: recursive
          persist-credentials: false
      - name: Verify preserved code and apply patches
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git -C app fetch --depth=1 origin "$APP_BASE"
          git -C app diff --exit-code "$APP_BASE" -- Socks5/ContentView.swift \
            Socks5/BackgroundKeepAlive/BackgroundKeepAlive.swift \
            Socks5/BackgroundKeepAlive/Info.plist Socks5/BackgroundKeepAlive/Silence.wav \
            Patches/hev-udp-port-zero.patch Patches/hev-udp-sockaddr.patch
          sh app/Tests/apply_traffic_stats.sh
          plutil -lint app/Socks5.xcodeproj/project.pbxproj
          {
            printf 'App: %s\nBase: %s\nCore: %s\n' "$GITHUB_SHA" "$APP_BASE" "$CORE_SHA"
            git -C core submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
            shasum -a 256 app/Patches/*.patch
          } > artifacts/build-info.txt
          git -C app archive --format=zip HEAD -o "$GITHUB_WORKSPACE/artifacts/Socks5-statistics-source.zip"
          cp app/Patches/* artifacts/
          cp app/LICENSE artifacts/LICENSE-app.txt
          find core -not -path '*/.git/*' -type f \( -iname LICENSE -o -iname COPYING \) \
            -exec sh -c 'printf "\n--- %s ---\n" "$1"; cat "$1"' sh {} \; > artifacts/LICENSES-core.txt
      - name: Native macOS protocol and exact-byte tests
        run: |
          set -euo pipefail
          (cd core && make -j3 static exec) > artifacts/macos-build.log 2>&1
          cc -std=gnu11 -O2 -Wall -Werror -pthread -Icore/src app/Tests/traffic_stats_host.c \
            core/bin/libhev-socks5-server.a core/third-part/yaml/bin/libyaml.a \
            core/third-part/hev-task-system/bin/libhev-task-system.a -o artifacts/stats-host
          python3 -u app/Tests/udp_sockaddr_regression.py core/bin/hev-socks5-server \
            --output artifacts/protocol-tests.json | tee artifacts/protocol-tests.log
          python3 -u app/Tests/traffic_stats_regression.py artifacts/stats-host \
            2> artifacts/stats-server.log | tee artifacts/stats-tests.log
          swiftc app/Socks5/Statistics/TrafficStatistics.swift app/Tests/traffic_statistics_model.swift \
            -o artifacts/stats-model
          artifacts/stats-model | tee artifacts/model-tests.log
          rm artifacts/stats-host artifacts/stats-model
          (cd core && make clean) >> artifacts/macos-build.log 2>&1
      - name: Build the patched Apple framework
        run: |
          set -euo pipefail
          (cd core && ./build-apple.sh) 2>&1 | tee artifacts/core-build.log
          git -C core apply -R "$GITHUB_WORKSPACE/app/Patches/hev-stats-server.patch"
          git -C core/src/core apply -R "$GITHUB_WORKSPACE/app/Patches/hev-stats-core.patch"
          git -C core/third-part/hev-task-system apply -R "$GITHUB_WORKSPACE/app/Patches/hev-stats-task-io.patch"
          git -C core/src/core apply -R "$GITHUB_WORKSPACE/app/Patches/hev-udp-sockaddr.patch"
          git -C core apply -R "$GITHUB_WORKSPACE/app/Patches/hev-udp-port-zero.patch"
          git -C core diff --exit-code
          git -C core submodule foreach --recursive 'git diff --exit-code'
          rm -rf app/HevSocks5Server.xcframework
          cp -R core/HevSocks5Server.xcframework app/
      - name: Archive iPhone application
        run: |
          set -euo pipefail
          xcodebuild archive -project app/Socks5.xcodeproj -scheme Socks5 \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/Socks5.xcarchive" \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/app-build.log
      - name: Verify and package IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          ditto build/Socks5.xcarchive/Products/Applications/Socks5.app package/Payload/Socks5.app
          APP='package/Payload/Socks5.app'
          plutil -lint "$APP/Info.plist"
          xcrun lipo "$APP/Socks5" -verify_arch arm64
          python3 - <<'PY'
          import pathlib, plistlib, wave
          app = pathlib.Path('package/Payload/Socks5.app')
          p = plistlib.loads((app / 'Info.plist').read_bytes())
          assert set(p['UIBackgroundModes']) == {'audio', 'location'}
          for key in ['NSLocationWhenInUseUsageDescription', 'NSLocationAlwaysAndWhenInUseUsageDescription', 'NSLocalNetworkUsageDescription']:
              assert p.get(key)
          with wave.open(str(app / 'Silence.wav'), 'rb') as w:
              assert w.getnframes() == 400 and w.readframes(400) == bytes(800)
          print('Permissions and digital silence preserved.')
          PY
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" > artifacts/app-info-plist.txt
          (cd package && zip -q -r ../artifacts/Socks5-statistics-unsigned.ipa Payload)
          unzip -t artifacts/Socks5-statistics-unsigned.ipa
          ditto -c -k --keepParent build/Socks5.xcarchive/dSYMs artifacts/Socks5-dSYMs.zip
          (cd artifacts && shasum -a 256 Socks5-statistics-unsigned.ipa > SHA256SUMS.txt)
          cat artifacts/build-info.txt > "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Socks5-statistics-unsigned
          path: artifacts/
          retention-days: 14
