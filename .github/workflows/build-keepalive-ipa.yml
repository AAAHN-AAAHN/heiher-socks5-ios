name: Build keep-alive IPA with address patch only

on:
  push:
    branches: [test/udp-sockaddr-only-20260921]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_BASE: 180012e8b9dbaa2002a68ebd2c75bccebcfb789c
      CORE_SHA: b3585289622561caf4b8789b436cc8820ecd6be0
      COMPARISON_BASE: 900ca327efd7a71a88f63040382b0158d3d6f513
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout modified app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: app
          persist-credentials: false

      - name: Checkout unchanged tested core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heiher/hev-socks5-server
          ref: ${{ env.CORE_SHA }}
          submodules: recursive
          path: core
          persist-credentials: false

      - name: Verify integration and record versions
        run: |
          set -euo pipefail
          mkdir -p artifacts
          git -C app fetch --depth=1 https://github.com/heiher/socks5-ios.git "$APP_BASE"
          git -C app diff --exit-code "$APP_BASE" -- Socks5/ContentView.swift
          git -C app fetch --depth=1 origin "$COMPARISON_BASE"
          git -C app diff --exit-code "$COMPARISON_BASE" -- Socks5 Socks5.xcodeproj Patches Tests
          plutil -lint app/Socks5.xcodeproj/project.pbxproj
          python3 - <<'PY'
          import os, pathlib, subprocess, wave
          root = pathlib.Path('app')
          original = subprocess.check_output(['git', '-C', 'app', 'show', os.environ['APP_BASE'] + ':Socks5/Socks5App.swift'])
          current = (root / 'Socks5/Socks5App.swift').read_bytes()
          assert current.replace(b'BackgroundKeepAliveRoot()', b'ContentView()') == original
          with wave.open(str(root / 'Socks5/BackgroundKeepAlive/Silence.wav'), 'rb') as w:
              assert (w.getnchannels(), w.getsampwidth(), w.getframerate(), w.getnframes()) == (1, 2, 8000, 400)
              assert w.readframes(400) == bytes(800)
          print('Original server UI unchanged; entry-point-only integration; WAV samples all zero.')
          PY
          {
            printf 'App commit: %s\nBase app: %s\nCore: %s\n' "$GITHUB_SHA" "$APP_BASE" "$CORE_SHA"
            git -C core submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } > artifacts/build-info.txt
          git -C app diff "$APP_BASE" -- Socks5 Socks5.xcodeproj > artifacts/app-changes.patch
          git -C app archive --format=zip HEAD -o "$GITHUB_WORKSPACE/artifacts/Socks5-keepalive-addr-only-source.zip"
          cp app/LICENSE artifacts/LICENSE-app.txt
          find core -not -path '*/.git/*' -type f \( -iname LICENSE -o -iname COPYING \) \
            -exec sh -c 'printf "\n--- %s ---\n" "$1"; cat "$1"' sh {} \; > artifacts/LICENSES-core.txt

      - name: Verify original port-zero connect path is retained
        run: |
          set -euo pipefail
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          git -C core diff --exit-code
          git -C core submodule foreach --recursive 'git diff --exit-code'
          test "$(git -C core hash-object src/hev-socks5-session.c)" = "06ce823dd3d29df9107bb53c12178e6b4ebf45c4"
          cp core/src/hev-socks5-session.c artifacts/unmodified-hev-socks5-session.c
          printf 'Port-zero patch: NOT APPLIED. Original session blob: 06ce823dd3d29df9107bb53c12178e6b4ebf45c4\n' >> artifacts/build-info.txt

      - name: Apply the single-file UDP address patch
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/app/Patches/hev-udp-sockaddr.patch"
          test "$(git -C core/src/core rev-parse HEAD)" = "162dd996299fc2d2bff2dd63728f8a2cd71ed31a"
          test "$(git -C core/src/core hash-object src/hev-socks5-udp.c)" = "084c03b98d8f80b646381d5cbf82eca95de2eddb"
          git -C core/src/core apply --check --whitespace=error-all "$PATCH"
          git -C core/src/core apply --whitespace=error-all "$PATCH"
          test "$(git -C core/src/core diff --name-only)" = 'src/hev-socks5-udp.c'
          cp "$PATCH" artifacts/hev-udp-sockaddr.patch
          git -C core/src/core diff --full-index > artifacts/udp-address-changes.patch
          git -C core/src/core hash-object src/hev-socks5-udp.c > artifacts/patched-udp-blob.txt
          shasum -a 256 "$PATCH" >> artifacts/build-info.txt
          cp core/src/core/src/hev-socks5-udp.c artifacts/patched-hev-socks5-udp.c

      - name: Record address-only UDP and TCP results on macOS
        run: |
          set -euo pipefail
          # This ablation build records networking failures without blocking the IPA.
          (cd core && make -j3) > artifacts/macos-patched-build.log 2>&1
          python3 -u app/Tests/udp_sockaddr_regression.py core/bin/hev-socks5-server \
            --output artifacts/macos-address-only.json --allow-failures | tee artifacts/macos-address-only.log
          (cd core && make clean) >> artifacts/macos-patched-build.log 2>&1

      - name: Build Hev framework with the address patch only
        run: |
          set -euo pipefail
          test "$(git -C core hash-object src/hev-socks5-session.c)" = "06ce823dd3d29df9107bb53c12178e6b4ebf45c4"
          (cd core && ./build-apple.sh) 2>&1 | tee artifacts/core-build.log
          test "$(git -C core hash-object src/hev-socks5-session.c)" = "06ce823dd3d29df9107bb53c12178e6b4ebf45c4"
          test "$(git -C core/src/core hash-object src/hev-socks5-udp.c)" = "$(cat artifacts/patched-udp-blob.txt)"
          git -C core/src/core apply --reverse --check "$GITHUB_WORKSPACE/app/Patches/hev-udp-sockaddr.patch"
          git -C core/src/core apply --reverse "$GITHUB_WORKSPACE/app/Patches/hev-udp-sockaddr.patch"
          test "$(git -C core/src/core hash-object src/hev-socks5-udp.c)" = "084c03b98d8f80b646381d5cbf82eca95de2eddb"
          test "$(git -C core hash-object src/hev-socks5-session.c)" = "06ce823dd3d29df9107bb53c12178e6b4ebf45c4"
          git -C core diff --exit-code
          git -C core submodule foreach --recursive 'git diff --exit-code'
          rm -rf app/HevSocks5Server.xcframework
          cp -R core/HevSocks5Server.xcframework app/

      - name: Archive app without signing
        run: |
          set -euo pipefail
          xcodebuild archive -project app/Socks5.xcodeproj -scheme Socks5 \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/Socks5.xcarchive" \
            CODE_SIGN_IDENTITY='' CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/app-build.log

      - name: Verify permissions and package IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          ditto build/Socks5.xcarchive/Products/Applications/Socks5.app package/Payload/Socks5.app
          APP='package/Payload/Socks5.app'
          plutil -lint "$APP/Info.plist"
          xcrun lipo "$APP/Socks5" -verify_arch arm64
          python3 - <<'PY'
          import pathlib, plistlib, wave
          app = pathlib.Path('package/Payload/Socks5.app')
          p = plistlib.loads((app / 'Info.plist').read_bytes())
          assert set(p['UIBackgroundModes']) == {'audio', 'location'}
          for key in ['NSLocationWhenInUseUsageDescription', 'NSLocationAlwaysAndWhenInUseUsageDescription', 'NSLocalNetworkUsageDescription']:
              assert p.get(key)
          with wave.open(str(app / 'Silence.wav'), 'rb') as w:
              assert w.getnframes() == 400 and w.readframes(400) == bytes(800)
          print('Packaged permissions and digital silence verified.')
          PY
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" > artifacts/app-info-plist.txt
          xcrun otool -L "$APP/Socks5" > artifacts/linked-libraries.txt
          (cd package && zip -q -r ../artifacts/Socks5-keepalive-addr-only-unsigned.ipa Payload)
          unzip -t artifacts/Socks5-keepalive-addr-only-unsigned.ipa
          ditto -c -k --keepParent build/Socks5.xcarchive/dSYMs artifacts/Socks5-dSYMs.zip
          (cd artifacts && shasum -a 256 Socks5-keepalive-addr-only-unsigned.ipa > SHA256SUMS.txt)
          printf '\nUnsigned ARM64 Release. Experimental address-only build. Original port-zero connect restored; only the unchanged UDP sockaddr patch is applied. macOS results are diagnostic, not a pass gate. iPhone testing required.\n' >> artifacts/build-info.txt
          cat artifacts/build-info.txt > "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA, source, symbols and build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Socks5-keepalive-addr-only-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
