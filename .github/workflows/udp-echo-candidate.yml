name: Verify Darwin TCP listener metadata correction
on:
  push:
    branches: [work/udp-echo-build-20261028]
permissions:
  contents: read
jobs:
  listener-fix:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate objects without changing refs
        run: python3 Bootstrap/import_candidates.py
      - name: Prepare exact base worktree
        run: git worktree add --detach "$RUNNER_TEMP/native-fix" 8780daaecf27fed23c21434fad18aef04ede93f5
      - name: Require original native cases and real listener lifecycle regression
        run: python3 Bootstrap/native-fix/run.py "$RUNNER_TEMP/native-fix"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-Darwin-listener-fix-${{ github.run_id }}
          path: |
            artifacts/candidate-prepare/
            Bootstrap/native-fix/
            ${{ runner.temp }}/native-fix/artifacts/native-listener-fix/*.json
            ${{ runner.temp }}/native-fix/artifacts/native-listener-fix/*.log
            ${{ runner.temp }}/native-fix/artifacts/native-listener-fix/native/*.json
            ${{ runner.temp }}/native-fix/artifacts/native-listener-fix/native/*.log
            ${{ runner.temp }}/native-fix/artifacts/native-listener-fix/native/*.yml
          if-no-files-found: error
          retention-days: 90
