name: Diagnose UDP Echo fixture across Simulator boot
on:
  push:
    branches: [work/udp-echo-build-20261028]
permissions:
  contents: read
jobs:
  simulator-fixture-diagnostic:
    name: Simulator fixture startup diagnostic (xcode-27)
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify immutable diagnostic source
        env:
          CANDIDATE_SHA: 4cc1a53416df1f888603df448126392c611b2bb9
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate integrated --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/simulator-fixture-controls"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/simulator-fixture-controls/source-prepare.json"
      - name: Compare real fixture startup before and after Simulator boot
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_output="$RUNNER_TEMP/udp-source/artifacts/simulator-fixture-controls"
          python3 Bootstrap/integrated_simulator_fixture_controls.py \
            --root "$RUNNER_TEMP/udp-source" --output "$diagnostic_output" \
            > "$diagnostic_output/driver.log" 2>&1
      - name: Record source preservation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          diagnostic_source="$RUNNER_TEMP/udp-source"
          if [ -d "$diagnostic_source" ]; then
            git -C "$diagnostic_source" rev-parse HEAD > "$diagnostic_source/artifacts/simulator-fixture-controls/tested-commit.txt"
            git -C "$diagnostic_source" diff --exit-code HEAD -- > "$diagnostic_source/artifacts/simulator-fixture-controls/source-worktree.log"
            git -C "$diagnostic_source" diff --cached --exit-code HEAD -- > "$diagnostic_source/artifacts/simulator-fixture-controls/source-index.log"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-simulator-fixture-diagnostic-${{ github.run_id }}
          path: |
            Bootstrap/integrated_simulator_fixture_controls.py
            Bootstrap/candidates.json
            Bootstrap/generation-receipt.json
            ${{ runner.temp }}/udp-source/artifacts/simulator-fixture-controls/
          if-no-files-found: error
          retention-days: 90
