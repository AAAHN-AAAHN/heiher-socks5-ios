name: Diagnose exact Integrated runtime registration retirement
on:
  push:
    branches: [work/udp-echo-build-20261028]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.runtime.outputs.matrix }}
      runtime-matrix: ${{ steps.runtime.outputs.matrix }}
      runtime-required: ${{ steps.runtime.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        run: python3 Bootstrap/import_candidates.py
      - id: runtime
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          rows = json.load(open('Bootstrap/candidates.json'))['matrix']
          assert {row['name'] for row in rows} <= {'main', 'udp', 'statistics', 'background', 'server', 'settings', 'icon', 'integrated'}
          rows = [row for row in rows if row.get('runtime') and row['name'] == 'integrated']
          assert len(rows) == 1
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
              stream.write('required=' + str(bool(rows)).lower() + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Bootstrap/
            artifacts/candidate-prepare/
          if-no-files-found: error
          retention-days: 90

  build:
    name: build (${{ matrix.name }}, ${{ matrix.sha }}, ${{ matrix.os }}, ${{ matrix.runtime }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate objects and create a detached local worktree
        env:
          CANDIDATE: ${{ matrix.name }}
          CANDIDATE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate "$CANDIDATE" --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare/"
      - name: Install exact formatter major
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/format-only"
            ln -sf "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
            echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
          fi
      - name: Demonstrate bounded UDP reply observation coordination
        if: ${{ runner.os == 'Linux' && matrix.name == 'background' }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/udp-observation-original" d1539f429b6a0e993adc9d50f816c3a29c3fac32
          diagnostic_status=0
          python3 Bootstrap/transport_observation_regression.py \
            --original-root "$RUNNER_TEMP/udp-observation-original" \
            --proposed-root "$RUNNER_TEMP/udp-source" \
            --swiftc "$(command -v swiftc)" \
            --output "$RUNNER_TEMP/udp-observation-comparison" || diagnostic_status=$?
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          origin = temporary / 'udp-observation-comparison'
          target = temporary / 'udp-source/artifacts/transport-observation-regression'
          target.mkdir(parents=True, exist_ok=False)
          names = ['focused-regression.json']
          for variant in ('original', 'proposed'):
              names += [variant + '/' + name for name in (
                  'compile/command.json', 'compile/stdout.log', 'compile/stderr.log',
                  'trial/process/command.json', 'trial/process/stdout.log',
                  'trial/process/stderr.log', 'trial/trial.json')]
          copied, missing, executables = [], [], []
          for name in names:
              path = origin / name
              if not path.is_file():
                  missing.append(name)
                  continue
              assert not path.is_symlink()
              data = path.read_bytes()
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              copied.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          for variant in ('original', 'proposed'):
              path = origin / variant / 'transport-probe'
              if path.is_file():
                  data = path.read_bytes()
                  executables.append({'variant': variant, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'mode': path.stat().st_mode & 0o777})
          (target / 'capture.json').write_text(json.dumps({'explicit_expected_files': names, 'copied': copied, 'missing': missing, 'compiled_executable_identities': executables, 'helper_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}, indent=2) + '\n')
          PYCODE
          exit "$diagnostic_status"
      - name: Execute the exact candidate owner gates
        working-directory: ${{ runner.temp }}/udp-source
        env:
          CANDIDATE: ${{ matrix.name }}
          BUILD_IPA: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ] && [ "$CANDIDATE" = integrated ]; then
            mkdir -p artifacts/integrated
            {
              xcodebuild -version
              xcrun --sdk iphoneos --show-sdk-version
              swiftc --version
              sw_vers
            } > artifacts/integrated/environment.txt
          fi
          case "$CANDIDATE" in
            udp) python3 Tests/udp_compat_audit.py ;;
            statistics) python3 Tests/Statistics/audit.py ;;
            *) bash Build/build.sh ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then
            case "$CANDIDATE" in
              udp)
                xcodebuild -version > artifacts/udp-final-audit/toolchain.txt
                xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/udp-final-audit/toolchain.txt | grep -E '^27\.'
                xcrun swiftc --version >> artifacts/udp-final-audit/toolchain.txt
                sw_vers >> artifacts/udp-final-audit/toolchain.txt
                xcrun swiftc -typecheck -swift-version 5 -warnings-as-errors \
                  -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.2 \
                  -I HevSocks5Server.xcframework/ios-arm64/Headers \
                  Socks5/Socks5App.swift Socks5/ContentView.swift \
                  > artifacts/udp-final-audit/ios-swift-typecheck.log 2>&1
                ;;
              server|settings|integrated) bash Build/check_swift_sdk.sh ;;
              background) bash Tests/Background/check_audio_sdk.sh ;;
            esac
            if [ "$CANDIDATE" = integrated ]; then
              python3 Build/verify_release.py > artifacts/integrated/package-review.log 2>&1
            fi
          fi
      - name: Build exact Apple products for the audited owner
        if: ${{ runner.os == 'macOS' && (matrix.name == 'udp' || matrix.name == 'statistics') }}
        env:
          CANDIDATE: ${{ matrix.name }}
        run: python3 Bootstrap/package_audited_owner.py --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source"
      - name: Preserve exact generated native products
        if: ${{ runner.os == 'macOS' }}
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-product
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          framework = root / '.build/core/HevSocks5Server.xcframework'
          files = {}
          for path in sorted(framework.rglob('*')):
              assert not path.is_symlink()
              if path.is_file():
                  raw = path.read_bytes()
                  files[str(path.relative_to(framework))] = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'mode': path.stat().st_mode & 0o777}
          assert files
          record = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'helper_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'framework': files}
          (root / 'artifacts/native-product/identity.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
          ditto -c -k --keepParent .build/core/HevSocks5Server.xcframework artifacts/native-product/HevSocks5Server.xcframework.zip
          shasum -a 256 artifacts/native-product/HevSocks5Server.xcframework.zip > artifacts/native-product/SHA256SUMS.txt
      - name: Package source-bound inputs for a fresh macOS runtime
        if: ${{ matrix.runtime }}
        env:
          CANDIDATE: ${{ matrix.name }}
        run: python3 Bootstrap/runtime_handoff.py pack --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source" --output "$RUNNER_TEMP/udp-source/artifacts/runtime-input/$CANDIDATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ matrix.runtime }}
        with:
          name: UDP-Echo-runtime-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/udp-source/artifacts/runtime-input/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable tested source
        if: always()
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/candidate-prepare/tested-commit.txt
          git diff --exit-code HEAD -- > artifacts/candidate-prepare/source-worktree.log
          git diff --cached --exit-code HEAD -- > artifacts/candidate-prepare/source-index.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-build-${{ matrix.name }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/udp-source/artifacts/
          if-no-files-found: error
          retention-days: 90

  runtime:
    name: DIAGNOSTIC runtime (${{ matrix.name }}, ${{ matrix.sha }}, ${{ matrix.os }})
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.runtime-required == 'true' }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.runtime-matrix) }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        id: runtime_control
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate objects and create a detached local worktree
        id: runtime_candidate
        env:
          CANDIDATE: ${{ matrix.name }}
          CANDIDATE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate "$CANDIDATE" --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare/"
      - name: Retrieve and verify the immutable producer artifact
        id: runtime_input
        env:
          CANDIDATE: ${{ matrix.name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/ci_evidence.py download --candidate "$CANDIDATE" --output "$RUNNER_TEMP/runtime-download"
          python3 Bootstrap/runtime_handoff.py restore --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source" --artifact "$RUNNER_TEMP/runtime-download/runtime-input.zip" --metadata "$RUNNER_TEMP/runtime-download/artifact.json" --producer-job build
      - name: Record the actual runtime interpreter before dependency provisioning
        id: runtime_python_before
        if: ${{ contains(fromJSON('["server","statistics","icon","settings","integrated"]'), matrix.name) }}
        shell: bash
        run: python3 -B Bootstrap/record_runtime_python.py before --source-root "$RUNNER_TEMP/udp-source"
      - name: Provision the exact CPython cache required by the original runtime
        id: runtime_python_setup
        if: ${{ contains(fromJSON('["server","statistics","icon","settings","integrated"]'), matrix.name) }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.9'
          architecture: arm64
          check-latest: false
          update-environment: false
          allow-prereleases: false
          freethreaded: false
      - name: Record and verify the actual completed runtime interpreter cache
        id: runtime_python_after
        if: ${{ always() && contains(fromJSON('["server","statistics","icon","settings","integrated"]'), matrix.name) && steps.runtime_python_before.outcome == 'success' }}
        shell: bash
        run: python3 -B Bootstrap/record_runtime_python.py after --source-root "$RUNNER_TEMP/udp-source"
      - name: Observe one bounded registration retirement and unchanged original consumers
        id: diagnostic
        working-directory: ${{ runner.temp }}/udp-source
        env:
          CANDIDATE: integrated
        shell: bash
        run: |
          exec python3 -B Build/observe_host_during_command.py \
            --output "$RUNNER_TEMP/runtime-recovery-host-observation" -- \
            python3 -B "$GITHUB_WORKSPACE/Bootstrap/run_runtime_recovery_probe.py"
      - name: Record immutable diagnostic source
        if: always()
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/runtime-recovery-source
          git rev-parse HEAD > artifacts/runtime-recovery-source/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/runtime-recovery-source/tree.txt
          git diff --exit-code HEAD -- > artifacts/runtime-recovery-source/worktree.log
          git diff --cached --exit-code HEAD -- > artifacts/runtime-recovery-source/index.log
      - name: Preserve actual diagnostic results without release credit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UDP-Echo-runtime-retirement-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/udp-source/artifacts/
            ${{ runner.temp }}/runtime-recovery-probe/
            ${{ runner.temp }}/runtime-duplicate-retirement/
            ${{ runner.temp }}/runtime-recovery-host-observation/
            ${{ runner.temp }}/runtime-download/artifact.json
          if-no-files-found: error
          retention-days: 90
