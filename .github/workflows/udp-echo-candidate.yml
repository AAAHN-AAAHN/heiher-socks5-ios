name: Observe daemon startup without runtime mutation
on:
  push:
    branches: [work/udp-echo-build-20261028]
permissions:
  contents: read
  actions: read
jobs:
  startup_observation:
    name: DIAGNOSTIC startup observation (integrated, 3a6ba06abcbffc48bb5c7290a5e53709e3809fbc, xcode-27)
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      CANDIDATE: integrated
      CANDIDATE_SHA: 3a6ba06abcbffc48bb5c7290a5e53709e3809fbc
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Import exact unchanged source without a build or producer artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate "$CANDIDATE" --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare/"
      - name: Record the actual runtime interpreter before dependency provisioning
        id: runtime_python_before
        shell: bash
        run: python3 -B Bootstrap/record_runtime_python.py before --source-root "$RUNNER_TEMP/udp-source"
      - name: Provision the exact CPython cache required by the original runtime
        id: runtime_python_setup
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.9'
          architecture: arm64
          check-latest: false
          update-environment: false
          allow-prereleases: false
          freethreaded: false
      - name: Record and verify the actual completed runtime interpreter cache
        id: runtime_python_after
        if: ${{ always() && steps.runtime_python_before.outcome == 'success' }}
        shell: bash
        run: python3 -B Bootstrap/record_runtime_python.py after --source-root "$RUNNER_TEMP/udp-source"
      - name: Bind the actual diagnostic job and unchanged source before the fixed observation
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PYCODE'
          from datetime import datetime, timezone
          import hashlib, json, os, pathlib, subprocess
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'udp-source'
          helper = pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          output = source / 'artifacts/startup-context'
          output.mkdir(exist_ok=False)
          keys = ('GITHUB_ACTIONS', 'GITHUB_REPOSITORY', 'GITHUB_SHA', 'GITHUB_RUN_ID',
                  'GITHUB_RUN_ATTEMPT', 'GITHUB_JOB', 'GITHUB_REF', 'GITHUB_EVENT_NAME',
                  'GITHUB_WORKFLOW', 'GITHUB_WORKFLOW_REF', 'GITHUB_WORKFLOW_SHA',
                  'RUNNER_OS', 'RUNNER_ARCH', 'RUNNER_NAME', 'DEVELOPER_DIR', 'CANDIDATE')
          report = {'schema': 'startup-observation-source-context-v1',
                    'actual_context': {k: os.environ.get(k) for k in keys}, 'commands': [],
                    'files': {'source': {}, 'helper': {}}, 'formal_candidate_credit': False,
                    'runtime_or_product_execution_credit': False}
          def now():
              return datetime.now(timezone.utc).isoformat()
          def digest(path):
              raw = path.read_bytes()
              return {'path': str(path), 'bytes': len(raw), 'sha256': hashlib.sha256(raw).hexdigest()}
          def run(role, arguments):
              argv = ['git', '-C', str({'source': source, 'helper': helper}[role]), *arguments]
              label = str(len(report['commands']))
              stdout, stderr = [output / (label + '.' + kind + '.log') for kind in ('stdout', 'stderr')]
              row = {'argv': argv, 'started_utc': now(), 'timeout_seconds': 10}
              report['commands'].append(row)
              with stdout.open('xb') as out, stderr.open('xb') as err:
                  process = subprocess.Popen(argv, stdout=out, stderr=err)
                  row['pid'] = process.pid
                  try:
                      row['returncode'] = process.wait(timeout=10)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait(timeout=1)
                      row.update(returncode=process.returncode, timeout=True)
                  finally:
                      row.update(finished_utc=now(), stdout=digest(stdout), stderr=digest(stderr))
              if row.get('timeout') or row.get('returncode') != 0:
                  raise RuntimeError('Actual context Git query failed: ' + repr(argv))
              return stdout.read_bytes()
          try:
              for role in ('source', 'helper'):
                  report[role] = {k: run(role, ['rev-parse', expression]).decode().strip()
                                  for k, expression in (('commit', 'HEAD'), ('tree', 'HEAD^{tree}'))}
                  run(role, ['diff', '--no-ext-diff', '--no-textconv', '--exit-code', 'HEAD', '--'])
                  run(role, ['diff', '--cached', '--no-ext-diff', '--no-textconv', '--exit-code', 'HEAD', '--'])
              if report['source'] != {'commit': '3a6ba06abcbffc48bb5c7290a5e53709e3809fbc', 'tree': '6e745ac08beb1ab9eeb9e367cdaa28148d2f3600'}:
                  raise RuntimeError('Actual source changed')
              if report['helper']['commit'] != os.environ['GITHUB_SHA'] or os.environ['GITHUB_JOB'] != 'startup_observation':
                  raise RuntimeError('Actual diagnostic helper/job differs')
              paths = {
                  'source': ['Build/runtime_environment.py', 'Build/observe_host_during_command.py',
                             'Build/ui_review.py', 'Build/simulator_review.py'],
                  'helper': ['Bootstrap/observe_runtime_startup.py', 'Bootstrap/observe_runtime_mounts.py',
                             'Bootstrap/import_candidates.py', 'Bootstrap/record_runtime_python.py',
                             'Bootstrap/candidates.json', '.github/workflows/udp-echo-candidate.yml']}
              for role, names in paths.items():
                  directory = {'source': source, 'helper': helper}[role]
                  for relative in names:
                      path = directory / relative
                      entry = run(role, ['ls-tree', 'HEAD', '--', relative]).decode().strip()
                      meta, actual_path = entry.split('\t', 1)
                      mode, kind, blob = meta.split()
                      if actual_path != relative or mode != '100644' or kind != 'blob':
                          raise RuntimeError('Tracked context entry/mode differs: ' + relative)
                      if path.is_symlink() or not path.is_file():
                          raise RuntimeError('Exact tracked context file differs: ' + relative)
                      raw = path.read_bytes()
                      if hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() != blob:
                          raise RuntimeError('Working context bytes differ from Git blob: ' + relative)
                      report['files'][role][relative] = dict(digest(path), git_blob=blob, git_mode=mode)
              report['context_binding_complete'] = True
          except BaseException as error:
              report['error'] = {'type': type(error).__name__, 'message': str(error)}
              report['context_binding_complete'] = False
              raise
          finally:
              (output / 'context.json').write_text(json.dumps(report, indent=2) + '\n')
          PYCODE
      - name: Observe nine fixed startup epochs without original preparation or consumers
        id: startup_observation
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          exec python3 -B Build/observe_host_during_command.py \
            --output "$RUNNER_TEMP/runtime-startup-host-observation" -- \
            "$RUNNER_TOOL_CACHE/Python/3.14.9/arm64/bin/python3.14" -B \
            "$GITHUB_WORKSPACE/Bootstrap/observe_runtime_startup.py" \
            > "$RUNNER_TEMP/runtime-startup-command.stdout.log" \
            2> "$RUNNER_TEMP/runtime-startup-command.stderr.log"
      - name: Record unchanged source after diagnostic observation
        if: always()
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/startup-source-after
          git rev-parse HEAD > artifacts/startup-source-after/commit.txt
          git rev-parse 'HEAD^{tree}' > artifacts/startup-source-after/tree.txt
          git diff --exit-code HEAD -- > artifacts/startup-source-after/worktree.log
          git diff --cached --exit-code HEAD -- > artifacts/startup-source-after/index.log
      - name: Preserve actual startup observations without build or runtime credit
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UDP-Echo-startup-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/udp-source/artifacts/
            ${{ runner.temp }}/runtime-startup-observation/
            ${{ runner.temp }}/runtime-startup-host-observation/
            ${{ runner.temp }}/runtime-startup-command.stdout.log
            ${{ runner.temp }}/runtime-startup-command.stderr.log
          if-no-files-found: error
          retention-days: 90
