name: Complete exact UDP Echo candidate verification
on:
  push:
    branches: [work/udp-echo-build-20261028]
permissions:
  contents: read
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      runtime-matrix: ${{ steps.runtime.outputs.matrix }}
      runtime-required: ${{ steps.runtime.outputs.required }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - id: prepare
        run: python3 Bootstrap/import_candidates.py
      - id: runtime
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json, os
          rows = json.load(open('Bootstrap/candidates.json'))['matrix']
          assert {row['name'] for row in rows} <= {'main', 'udp', 'statistics', 'background', 'server', 'settings', 'icon', 'integrated'}
          rows = [row for row in rows if row.get('runtime')]
          with open(os.environ['GITHUB_OUTPUT'], 'a') as stream:
              stream.write('matrix=' + json.dumps({'include': rows}, separators=(',', ':')) + '\n')
              stream.write('required=' + str(bool(rows)).lower() + '\n')
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-prepare-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Bootstrap/
            artifacts/candidate-prepare/
          if-no-files-found: error
          retention-days: 90

  build:
    name: build (${{ matrix.name }}, ${{ matrix.sha }}, ${{ matrix.os }}, ${{ matrix.runtime }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate objects and create a detached local worktree
        env:
          CANDIDATE: ${{ matrix.name }}
          CANDIDATE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate "$CANDIDATE" --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare/"
      - name: Install exact formatter major
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/format-only"
            ln -sf "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
            echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
          fi
      - name: Demonstrate bounded UDP reply observation coordination
        if: ${{ runner.os == 'Linux' && matrix.name == 'background' }}
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/udp-observation-original" d1539f429b6a0e993adc9d50f816c3a29c3fac32
          diagnostic_status=0
          python3 Bootstrap/transport_observation_regression.py \
            --original-root "$RUNNER_TEMP/udp-observation-original" \
            --proposed-root "$RUNNER_TEMP/udp-source" \
            --swiftc "$(command -v swiftc)" \
            --output "$RUNNER_TEMP/udp-observation-comparison" || diagnostic_status=$?
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          temporary = Path(os.environ['RUNNER_TEMP'])
          origin = temporary / 'udp-observation-comparison'
          target = temporary / 'udp-source/artifacts/transport-observation-regression'
          target.mkdir(parents=True, exist_ok=False)
          names = ['focused-regression.json']
          for variant in ('original', 'proposed'):
              names += [variant + '/' + name for name in (
                  'compile/command.json', 'compile/stdout.log', 'compile/stderr.log',
                  'trial/process/command.json', 'trial/process/stdout.log',
                  'trial/process/stderr.log', 'trial/trial.json')]
          copied, missing, executables = [], [], []
          for name in names:
              path = origin / name
              if not path.is_file():
                  missing.append(name)
                  continue
              assert not path.is_symlink()
              data = path.read_bytes()
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              copied.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          for variant in ('original', 'proposed'):
              path = origin / variant / 'transport-probe'
              if path.is_file():
                  data = path.read_bytes()
                  executables.append({'variant': variant, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest(), 'mode': path.stat().st_mode & 0o777})
          (target / 'capture.json').write_text(json.dumps({'explicit_expected_files': names, 'copied': copied, 'missing': missing, 'compiled_executable_identities': executables, 'helper_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}, indent=2) + '\n')
          PYCODE
          exit "$diagnostic_status"
      - name: Execute the exact candidate owner gates
        working-directory: ${{ runner.temp }}/udp-source
        env:
          CANDIDATE: ${{ matrix.name }}
          BUILD_IPA: '1'
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = macOS ] && [ "$CANDIDATE" = integrated ]; then
            mkdir -p artifacts/integrated
            {
              xcodebuild -version
              xcrun --sdk iphoneos --show-sdk-version
              swiftc --version
              sw_vers
            } > artifacts/integrated/environment.txt
          fi
          case "$CANDIDATE" in
            udp) python3 Tests/udp_compat_audit.py ;;
            statistics) python3 Tests/Statistics/audit.py ;;
            *) bash Build/build.sh ;;
          esac
          if [ "$RUNNER_OS" = macOS ]; then
            case "$CANDIDATE" in
              udp)
                xcodebuild -version > artifacts/udp-final-audit/toolchain.txt
                xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/udp-final-audit/toolchain.txt | grep -E '^27\.'
                xcrun swiftc --version >> artifacts/udp-final-audit/toolchain.txt
                sw_vers >> artifacts/udp-final-audit/toolchain.txt
                xcrun swiftc -typecheck -swift-version 5 -warnings-as-errors \
                  -sdk "$(xcrun --sdk iphoneos --show-sdk-path)" -target arm64-apple-ios17.2 \
                  -I HevSocks5Server.xcframework/ios-arm64/Headers \
                  Socks5/Socks5App.swift Socks5/ContentView.swift \
                  > artifacts/udp-final-audit/ios-swift-typecheck.log 2>&1
                ;;
              server|settings|integrated) bash Build/check_swift_sdk.sh ;;
              background) bash Tests/Background/check_audio_sdk.sh ;;
            esac
            if [ "$CANDIDATE" = integrated ]; then
              python3 Build/verify_release.py > artifacts/integrated/package-review.log 2>&1
            fi
          fi
      - name: Build exact Apple products for the audited owner
        if: ${{ runner.os == 'macOS' && (matrix.name == 'udp' || matrix.name == 'statistics') }}
        env:
          CANDIDATE: ${{ matrix.name }}
        run: python3 Bootstrap/package_audited_owner.py --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source"
      - name: Preserve exact generated native products
        if: ${{ runner.os == 'macOS' }}
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/native-product
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path('.')
          framework = root / '.build/core/HevSocks5Server.xcframework'
          files = {}
          for path in sorted(framework.rglob('*')):
              assert not path.is_symlink()
              if path.is_file():
                  raw = path.read_bytes()
                  files[str(path.relative_to(framework))] = {'size': len(raw), 'sha256': hashlib.sha256(raw).hexdigest(), 'mode': path.stat().st_mode & 0o777}
          assert files
          record = {'commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(), 'helper_commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'], 'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'framework': files}
          (root / 'artifacts/native-product/identity.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
          ditto -c -k --keepParent .build/core/HevSocks5Server.xcframework artifacts/native-product/HevSocks5Server.xcframework.zip
          shasum -a 256 artifacts/native-product/HevSocks5Server.xcframework.zip > artifacts/native-product/SHA256SUMS.txt
      - name: Package source-bound inputs for a fresh macOS runtime
        if: ${{ matrix.runtime }}
        env:
          CANDIDATE: ${{ matrix.name }}
        run: python3 Bootstrap/runtime_handoff.py pack --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source" --output "$RUNNER_TEMP/udp-source/artifacts/runtime-input/$CANDIDATE"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ matrix.runtime }}
        with:
          name: UDP-Echo-runtime-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/udp-source/artifacts/runtime-input/${{ matrix.name }}/
          if-no-files-found: error
          retention-days: 90
      - name: Record immutable tested source
        if: always()
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/candidate-prepare/tested-commit.txt
          git diff --exit-code HEAD -- > artifacts/candidate-prepare/source-worktree.log
          git diff --cached --exit-code HEAD -- > artifacts/candidate-prepare/source-index.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-build-${{ matrix.name }}-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/udp-source/artifacts/
          if-no-files-found: error
          retention-days: 90

  runtime:
    name: runtime (${{ matrix.name }}, ${{ matrix.sha }}, ${{ matrix.os }}, ${{ matrix.runtime }})
    if: ${{ always() && needs.prepare.result == 'success' && needs.prepare.outputs.runtime-required == 'true' }}
    needs: [prepare, build]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.prepare.outputs.runtime-matrix) }}
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify candidate objects and create a detached local worktree
        env:
          CANDIDATE: ${{ matrix.name }}
          CANDIDATE_SHA: ${{ matrix.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/import_candidates.py --candidate "$CANDIDATE" --sha "$CANDIDATE_SHA"
          git worktree add --detach "$RUNNER_TEMP/udp-source" "$CANDIDATE_SHA"
          mkdir -p "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare"
          cp artifacts/candidate-prepare/result.json "$RUNNER_TEMP/udp-source/artifacts/candidate-prepare/"
      - name: Retrieve and verify the immutable producer artifact
        env:
          CANDIDATE: ${{ matrix.name }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 Bootstrap/ci_evidence.py download --candidate "$CANDIDATE" --output "$RUNNER_TEMP/runtime-download"
          python3 Bootstrap/runtime_handoff.py restore --candidate "$CANDIDATE" --root "$RUNNER_TEMP/udp-source" --artifact "$RUNNER_TEMP/runtime-download/runtime-input.zip" --metadata "$RUNNER_TEMP/runtime-download/artifact.json" --producer-job build
      - name: Execute requested macOS runtime coverage
        working-directory: ${{ runner.temp }}/udp-source
        env:
          CANDIDATE: ${{ matrix.name }}
        shell: bash
        run: |
          set -euo pipefail
          runtime_observer_bind() {
            "$runtime_common_python" -B - "$runtime_common_source_root" "$runtime_common_source_commit" "$@" <<'HOST_OBSERVER_BINDING'
          import hashlib, pathlib, stat, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          relative = 'Build/observed_command_status.py'
          path = root / relative
          if not root.is_absolute() or root.resolve(strict=True) != root or path.is_symlink() or path.parent.is_symlink():
              raise SystemExit('Status reader must be an unlinked file in the exact source root')
          info = path.stat()
          if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o644 or info.st_nlink != 1 or info.st_size != 16069:
              raise SystemExit('Status reader file type, mode, links or size differs')
          raw = path.read_bytes()
          expected_reader_sha256 = {
              'server': '1c8345f864b3a84d72ee43b3eef67ef3f307836d47d513dc25daeb1c6ebc1ca5',
              'settings': '1c8345f864b3a84d72ee43b3eef67ef3f307836d47d513dc25daeb1c6ebc1ca5',
              'statistics': '2fee551ef38bcfea0077cc2305aeff67268df6b19e0a0fa762f8afcc413558fa',
              'integrated': '1c8345f864b3a84d72ee43b3eef67ef3f307836d47d513dc25daeb1c6ebc1ca5',
          }[sys.argv[4]]
          if len(raw) != 16069 or hashlib.sha256(raw).hexdigest() != expected_reader_sha256:
              raise SystemExit('Status reader bytes differ from the frozen reader')
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          entry = subprocess.run(['git', '-C', str(root), 'ls-tree', sys.argv[2], '--', relative], capture_output=True, timeout=10)
          if entry.returncode != 0 or entry.stderr != b'' or entry.stdout != ('100644 blob ' + blob + '\t' + relative + '\n').encode():
              raise SystemExit('Status reader is not tracked exactly by the actual source commit')
          sys.argv = [str(path), *sys.argv[3:]]
          exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          HOST_OBSERVER_BINDING
          }
          case "$CANDIDATE" in
            server|settings) core=.build/core ;;
            statistics) core=.build/statistics-final-audit/core ;;
            *) core= ;;
          esac
          if [ -n "$core" ]; then
            server_ref=$(python3 -c 'import json; print(json.load(open("Build/upstream.json"))["sources"]["."])')
            git clone --no-checkout https://github.com/heiher/hev-socks5-server.git "$core"
            git -C "$core" checkout --detach "$server_ref"
            git -C "$core" submodule update --init --recursive
            python3 Build/check.py checkout "$core"
          fi
          case "$CANDIDATE" in
            server|settings|statistics|icon|integrated)
              runtime_common_source_root="$(pwd -P)"
              runtime_common_source_commit="$(git rev-parse HEAD)"
              runtime_common_source_tree="$(git rev-parse 'HEAD^{tree}')"
              runtime_common_cache="${RUNNER_TOOL_CACHE:?}/Python/3.14.9/arm64"
              runtime_common_python="$runtime_common_cache/bin/python3.14"
              if [[ ! -f "${runtime_common_cache}.complete" || ! -x "$runtime_common_python" ]]; then
                printf 'Required completed CPython3.14.9 arm64 cache is unavailable.\n' >&2
                exit 1
              fi
              runtime_common_helper=Build/runtime_environment.py
              if [ "$CANDIDATE" = icon ]; then runtime_common_helper=Tests/AppIcon/runtime_environment.py; fi
              runtime_common_args=(--mode candidate --owner "$CANDIDATE"
                --source-root "$runtime_common_source_root" --source-commit "$runtime_common_source_commit" --source-tree "$runtime_common_source_tree")
              runtime_common_control_root="${GITHUB_WORKSPACE:?}"
              runtime_common_control_tree="$(git -C "$runtime_common_control_root" rev-parse 'HEAD^{tree}')"
              runtime_common_args+=(--control-root "$runtime_common_control_root" --control-commit "$GITHUB_SHA" --control-tree "$runtime_common_control_tree")
              runtime_common_invoke() {
                "$runtime_common_python" "$runtime_common_helper" "$@" "${runtime_common_args[@]}"
              }
              # Capture real process status even under the original set -e discipline.
              if runtime_common_invoke prepare; then
                runtime_common_prepare_status=0
              else
                runtime_common_prepare_status=$?
              fi
              if runtime_common_invoke record-prepare-exit --actual-status "$runtime_common_prepare_status"; then
                runtime_common_record_status=0
              else
                runtime_common_record_status=$?
              fi
              if [ "$runtime_common_prepare_status" -ne 0 ]; then exit "$runtime_common_prepare_status"; fi
              if [ "$runtime_common_record_status" -ne 0 ]; then exit "$runtime_common_record_status"; fi
              ;;
          esac
          case "$CANDIDATE" in
            server)
              runtime_common_invoke before --consumer server-ui
              runtime_observer_bind before server server-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
              runtime_observer_output="$runtime_common_source_root/artifacts/server-control-ui-audit/runtime-preparation/consumers/server-ui/host-observation"
              if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Tests/ServerControl/ui_audit.py; then
                runtime_observer_actual_status=0
              else
                runtime_observer_actual_status=$?
              fi
              runtime_common_original_status=
              if runtime_common_original_status="$(runtime_observer_bind after server server-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
                runtime_observer_binding_status=0
              else
                runtime_observer_binding_status=$?
              fi
              if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
                if runtime_common_invoke after --consumer server-ui --actual-status "$runtime_common_original_status"; then
                  runtime_common_after_status=0
                else
                  runtime_common_after_status=$?
                fi
              else
                printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
                if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
                exit 1
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              ;;
            settings)
              runtime_common_invoke before --consumer settings-ui
              runtime_observer_bind before settings settings-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
              runtime_observer_output="$runtime_common_source_root/artifacts/settings-persistence-ui-audit/runtime-preparation/consumers/settings-ui/host-observation"
              if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Tests/Settings/ui_audit.py; then
                runtime_observer_actual_status=0
              else
                runtime_observer_actual_status=$?
              fi
              runtime_common_original_status=
              if runtime_common_original_status="$(runtime_observer_bind after settings settings-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
                runtime_observer_binding_status=0
              else
                runtime_observer_binding_status=$?
              fi
              if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
                if runtime_common_invoke after --consumer settings-ui --actual-status "$runtime_common_original_status"; then
                  runtime_common_after_status=0
                else
                  runtime_common_after_status=$?
                fi
              else
                printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
                if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
                exit 1
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              ;;
            icon)
              runtime_common_invoke before --consumer icon-ui
              if bash Tests/AppIcon/run_checks.sh; then
                runtime_common_original_status=0
              else
                runtime_common_original_status=$?
              fi
              if runtime_common_invoke after --consumer icon-ui --actual-status "$runtime_common_original_status"; then
                runtime_common_after_status=0
              else
                runtime_common_after_status=$?
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              ;;
            background)
              python3 Tests/Background/native_inputs.py verify
              python3 Tests/Background/check_async_ui.py
              ;;
            statistics)
              runtime_common_invoke before --consumer statistics-ui
              runtime_observer_bind before statistics statistics-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
              runtime_observer_output="$runtime_common_source_root/artifacts/statistics-ui-audit/runtime-preparation/consumers/statistics-ui/host-observation"
              if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Tests/Statistics/ui_audit.py; then
                runtime_observer_actual_status=0
              else
                runtime_observer_actual_status=$?
              fi
              runtime_common_original_status=
              if runtime_common_original_status="$(runtime_observer_bind after statistics statistics-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
                runtime_observer_binding_status=0
              else
                runtime_observer_binding_status=$?
              fi
              if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
                if runtime_common_invoke after --consumer statistics-ui --actual-status "$runtime_common_original_status"; then
                  runtime_common_after_status=0
                else
                  runtime_common_after_status=$?
                fi
              else
                printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
                if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
                exit 1
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              ;;
            integrated)
              runtime_common_invoke before --consumer integrated-ui
              runtime_observer_bind before integrated integrated-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
              runtime_observer_output="$runtime_common_source_root/artifacts/integrated/runtime-preparation/consumers/integrated-ui/host-observation"
              if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Build/ui_review.py > artifacts/integrated/ui-review.log 2>&1; then
                runtime_observer_actual_status=0
              else
                runtime_observer_actual_status=$?
              fi
              runtime_common_original_status=
              if runtime_common_original_status="$(runtime_observer_bind after integrated integrated-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
                runtime_observer_binding_status=0
              else
                runtime_observer_binding_status=$?
              fi
              if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
                if runtime_common_invoke after --consumer integrated-ui --actual-status "$runtime_common_original_status"; then
                  runtime_common_after_status=0
                else
                  runtime_common_after_status=$?
                fi
              else
                printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
                if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
                exit 1
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              runtime_common_invoke before --consumer integrated-simulator
              runtime_observer_bind before integrated integrated-simulator "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
              runtime_observer_output="$runtime_common_source_root/artifacts/integrated/runtime-preparation/consumers/integrated-simulator/host-observation"
              if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Build/simulator_review.py > artifacts/integrated/simulator-review.log 2>&1; then
                runtime_observer_actual_status=0
              else
                runtime_observer_actual_status=$?
              fi
              runtime_common_original_status=
              if runtime_common_original_status="$(runtime_observer_bind after integrated integrated-simulator "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
                runtime_observer_binding_status=0
              else
                runtime_observer_binding_status=$?
              fi
              if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
                if runtime_common_invoke after --consumer integrated-simulator --actual-status "$runtime_common_original_status"; then
                  runtime_common_after_status=0
                else
                  runtime_common_after_status=$?
                fi
              else
                printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
                if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
                exit 1
              fi
              if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
              if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
              ;;
            *) echo "Unsupported runtime candidate: $CANDIDATE" >&2; exit 1 ;;
          esac
      - name: Record immutable tested source
        if: always()
        working-directory: ${{ runner.temp }}/udp-source
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > artifacts/candidate-prepare/tested-commit.txt
          git diff --exit-code HEAD -- > artifacts/candidate-prepare/source-worktree.log
          git diff --cached --exit-code HEAD -- > artifacts/candidate-prepare/source-index.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-runtime-results-${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/udp-source/artifacts/
            ${{ runner.temp }}/runtime-download/artifact.json
          if-no-files-found: error
          retention-days: 90

  verify:
    name: verify (${{ matrix.name }}, ${{ matrix.sha }}, ${{ matrix.os }}, ${{ matrix.runtime }})
    if: ${{ always() && needs.prepare.result == 'success' }}
    needs: [prepare, build, runtime]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Conclude exact-source owner and runtime verification
        env:
          CANDIDATE: ${{ matrix.name }}
          PLATFORM: ${{ matrix.os }}
          GH_TOKEN: ${{ github.token }}
        run: python3 Bootstrap/ci_evidence.py gate --candidate "$CANDIDATE" --platform "$PLATFORM" --output artifacts/final-gate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UDP-Echo-final-gate-${{ matrix.name }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/final-gate/
          if-no-files-found: error
          retention-days: 90
