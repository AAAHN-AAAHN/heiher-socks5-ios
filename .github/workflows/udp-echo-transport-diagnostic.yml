name: Exact original UDP echo transport diagnostic
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  transport-diagnostic:
    name: Fixed original and traced-copy transport diagnostic (xcode-27)
    runs-on: xcode-27
    timeout-minutes: 20
    env:
      BUILD_IPA: '1'
    steps:
      - name: Check out the exact diagnostic helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: helper
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the unchanged Integrated source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 8bec30de328543f8f23b79a736385ed0e80aaa88
          path: exact-source
          fetch-depth: 0
          persist-credentials: false
      - name: Install formatter without overriding the compiler
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm@18
          mkdir -p "$RUNNER_TEMP/format-only"
          ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
          echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
      - name: Run the fixed original selected, original full, and traced-copy selected trials
        shell: bash
        run: |
          python3 helper/Bootstrap/run_udp_echo_transport_diagnostic.py --source exact-source --output transport-diagnostic-output
      - name: Preserve actual outputs and exact diagnostic recipes
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UDP-echo-transport-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            transport-diagnostic-output/
            helper/Bootstrap/run_udp_echo_transport_diagnostic.py
            helper/Bootstrap/instrument_udp_echo_transport.py
            helper/.github/workflows/udp-echo-transport-diagnostic.yml
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
