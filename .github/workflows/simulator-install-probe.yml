name: Observe exact captured Simulator app installation
on:
  push:
    branches: [work/simulator-diagnostics]
    paths:
      - .github/workflows/simulator-install-probe.yml
      - Diagnostics/CoreSimulator/install_probe.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: simulator-install-probe
  cancel-in-progress: false
jobs:
  observe-installation:
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - name: Check out diagnostic tools only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: diagnostic
          persist-credentials: false
          fetch-depth: 0
      - name: Download the exact retained failure artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: '11598450523'
          run-id: '37886501429'
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: input
      - name: Observe installation with the unchanged 120-second deadline
        run: >-
          python3 diagnostic/Diagnostics/CoreSimulator/install_probe.py
          --app-tar input/integrated/simulator/failure-app/Socks5.app.tar.gz
          --source-json input/integrated/source-identity.json
          --output artifacts/simulator-install-probe
      - name: Retain installation observations independently of product gates
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CoreSimulator-install-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/simulator-install-probe/
          retention-days: 30
