name: Verify declared modules and build release
on:
  push:
    branches: [feature/server-runtime, feature/config-persistence, release/integrated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Select compiler and exact formatter without replacing the Apple SDK
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/module-tools"
            ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/module-tools/clang-format-18"
            printf '#!/bin/sh\nexec /usr/bin/xcrun --sdk macosx clang "$@"\n' > "$RUNNER_TEMP/module-tools/clang"
            chmod +x "$RUNNER_TEMP/module-tools/clang"
            echo "$RUNNER_TEMP/module-tools" >> "$GITHUB_PATH"
          fi
      - name: Validate composition and build only the requested release IPA
        shell: bash
        run: |
          set -euo pipefail
          if [ "$(python3 -c 'import json; print(json.load(open("Build/features.json"))["name"])')" = integrated ]; then
            bash Build/build.sh
          else
            bash Build/build.sh --checks-only
          fi
      - name: Record artifact name
        if: always()
        shell: bash
        run: echo "FEATURE=$(python3 -c 'import json; print(json.load(open("Build/features.json"))["name"])')" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Module-${{ env.FEATURE }}-${{ runner.os }}
          path: artifacts/
          retention-days: 30
