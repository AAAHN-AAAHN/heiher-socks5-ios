name: Verify server and persistent-settings boundaries
on:
  push:
    branches: [feature/server-control, feature/settings-persistence]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install formatter without replacing the compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/format-only"
            ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
            echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
          fi
      - name: Native, lifecycle and persistence checks without IPA
        shell: bash
        run: BUILD_IPA=0 bash Build/build.sh
      - name: Actual iOS 27 API type checks
        if: runner.os == 'macOS'
        run: bash Build/check_swift_sdk.sh
      - name: Record exact tested source
        if: always()
        run: python3 Build/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Feature-checks-${{ runner.os }}
          path: artifacts/
          retention-days: 30
