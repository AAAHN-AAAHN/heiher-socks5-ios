name: Verify and build declared SOCKS5 features
on:
  push:
    branches: [main, feature/udp-compat, feature/icmp-relay, feature/traffic-statistics, feature/background, feature/server-control, feature/settings-persistence, feature/app-icon, release/integrated]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[audio-checks-only]') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install upstream formatter
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$HOME/.local/bin"
            ln -sf "$(brew --prefix llvm@18)/bin/clang-format" "$HOME/.local/bin/clang-format-18"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi
      - name: Validate source, test native code, and archive iOS on macOS
        id: build
        shell: bash
        run: bash Build/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        with:
          name: Socks5-${{ steps.build.outputs.composition }}-${{ runner.os }}
          path: ${{ steps.build.outputs.artifact_path }}
          retention-days: 30
  audio-checks:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-checks-only]') }}
    runs-on: xcode-27
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare the declared native ICMP sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/audio-checks
          python3 Build/native_sources.py checkout server .build/server > artifacts/audio-checks/native-inputs.json
          python3 Build/check.py apply .build/server > artifacts/audio-checks/native-patches.log
      - name: Audio tests and iOS 27 type checks only (no archive or IPA)
        shell: bash
        run: bash Tests/Background/check_audio_sdk.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Background-audio-checks-no-IPA
          path: |
            artifacts/audio-checks/
            artifacts/background/periodic-ping/
          retention-days: 30
  audio-async-ui:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-checks-only]') }}
    needs: audio-checks
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Build the declared native framework for Simulator tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/audio-async-ui
          python3 Build/native_sources.py checkout server .build/server > artifacts/audio-async-ui/native-inputs.json
          python3 Build/check.py apply .build/server > artifacts/audio-async-ui/native-patches.log
          (cd .build/server && ./build-apple.sh) > artifacts/audio-async-ui/native-apple.log 2>&1
      - name: Actual iOS 27 async audio UI and runtime advisory checks (no IPA)
        shell: bash
        run: python3 Tests/Background/check_async_ui.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Background-async-audio-Simulator
          path: artifacts/audio-async-ui/
          retention-days: 30
  audio-recovery-linux:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audio-checks-only]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Exact-source recovery and negative controls (no Apple execution)
        run: |
          set -euo pipefail
          mkdir -p artifacts/recovery-linux
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          git rev-parse HEAD > artifacts/recovery-linux/tested-commit.txt
          git archive --format=zip HEAD -o artifacts/recovery-linux/source.zip
          swiftc --version > artifacts/recovery-linux/toolchain.txt
          python3 Tests/Background/check_interruption_policy.py > artifacts/recovery-linux/policy.log 2>&1
          git diff --exit-code HEAD --
          git diff --cached --exit-code HEAD --
          echo 'PASS: exact-source policy tests; no Apple execution' > artifacts/recovery-linux/SUCCESS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Background-recovery-Linux
          path: artifacts/recovery-linux/
          retention-days: 30
