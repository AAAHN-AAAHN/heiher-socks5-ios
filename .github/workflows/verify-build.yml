name: Verify and build integrated eight-branch release
on:
  push:
    branches: [release/integrated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install formatter without overriding the compiler
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/format-only"
            ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
            echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version | grep -E '^27\.'
          fi
      - name: Verify all features and build release IPA on macOS
        shell: bash
        run: bash Build/build.sh
      - name: Check actual iOS 27 API and release package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          bash Build/check_swift_sdk.sh
          python3 Build/verify_release.py > artifacts/integrated/package-review.log 2>&1
      - name: Run production app with saved tabs and Start/Stop on iOS 27 Simulator
        if: runner.os == 'macOS'
        shell: bash
        run: python3 Build/simulator_review.py > artifacts/integrated/simulator-review.log 2>&1
      - name: Record exact source
        if: always()
        run: python3 Build/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Integrated-release-${{ runner.os }}
          path: artifacts/
          retention-days: 30
  finish-requested-split:
    needs: verify
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[integrate-eight]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Remove only the superseded settings branch after successful verification
        run: python3 Build/finish_branch_split.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Final-eight-branch-layout
          path: artifacts/branch-layout/
          retention-days: 30
