name: Retire rejected cycled-audio branch
on:
  push:
    branches: [feature/background]
permissions:
  contents: read
jobs:
  retire:
    if: ${{ github.repository == 'AAAHN-AAAHN/heiher-socks5-ios' && github.ref == 'refs/heads/feature/background' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete only the explicitly rejected branch at its observed revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          root = 'https://api.github.com/repos/AAAHN-AAAHN/heiher-socks5-ios/git/'
          name = 'heads/feature/background-cycled-audio'
          expected = '68fa715fabb60b4e558771c3289af063a96a4a24'
          def call(path, method='GET'):
              request = urllib.request.Request(root + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as error:
                  if error.code == 404: return 404, None
                  raise
          status, before = call('ref/' + name)
          if status == 200:
              if before['object']['sha'] != expected:
                  raise SystemExit('Ref changed; refusing deletion of unreviewed work')
              status, _ = call('refs/' + name, 'DELETE')
              if status != 204: raise SystemExit('Deletion did not return 204')
          status, _ = call('ref/' + name)
          if status != 404: raise SystemExit('Ref still exists')
          result = {'ref': name, 'expected_before': expected, 'before': before,
                    'after_http_status': status, 'operation_commit': os.environ['GITHUB_SHA'],
                    'run_id': os.environ['GITHUB_RUN_ID'],
                    'scope': 'Branch ref removal only; no history rewrite or artifact deletion'}
          Path('retirement.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Cycled-branch-retirement
          path: retirement.json
          retention-days: 30
