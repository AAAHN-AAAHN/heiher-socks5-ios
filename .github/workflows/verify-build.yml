name: Verify and build current integrated release
on:
  push:
    branches: [release/integrated]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-linux:
    name: verify (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BUILD_IPA: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install formatter without overriding the compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y clang-format-18
      - name: Exact latest composition, native and model checks
        id: build
        run: bash Build/build.sh
      - name: Record exact source independently of generated products
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        run: python3 Build/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        with:
          name: Socks5-${{ steps.build.outputs.composition }}-${{ runner.os }}
          path: ${{ steps.build.outputs.artifact_path }}
          retention-days: 30

  verify-macos:
    name: verify (xcode-27)
    runs-on: xcode-27
    timeout-minutes: 90
    env:
      BUILD_IPA: '1'
    outputs:
      review-artifact-id: ${{ steps.review-upload.outputs.artifact-id }}
      review-artifact-digest: ${{ steps.review-upload.outputs.artifact-digest }}
      review-archive-sha256: ${{ steps.review-input.outputs.archive-sha256 }}
      producer-attempt: ${{ steps.review-input.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Install formatter without overriding the compiler
        shell: bash
        run: |
          set -euo pipefail
          brew install llvm@18
          mkdir -p "$RUNNER_TEMP/format-only"
          ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
          echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
      - name: Exact latest composition, native and model checks; ARM64 archive on macOS
        id: build
        run: bash Build/build.sh
      - name: Record the actual Apple build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated
          xcodebuild -version | tee artifacts/integrated/environment.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/integrated/environment.txt | grep -E '^27\.'
          xcrun swiftc --version >> artifacts/integrated/environment.txt
          sw_vers >> artifacts/integrated/environment.txt
      - name: Actual iOS 27 type check and archived IPA validation
        shell: bash
        run: |
          set -euo pipefail
          bash Build/check_swift_sdk.sh
          python3 Build/verify_release.py > artifacts/integrated/package-review.log 2>&1
      - name: Preserve verified product bytes and modes for the independent review job
        id: review-input
        run: python3 Build/review_handoff.py pack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: review-upload
        with:
          name: Integrated-review-input-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/integrated-input/review-input.tar.gz
          if-no-files-found: error
          retention-days: 30
      - name: Remove the consumed product source
        if: always()
        run: rm -rf .build/integrated-product-source
      - name: Record exact source independently of generated products
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        run: python3 Build/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        with:
          name: Socks5-${{ steps.build.outputs.composition }}-${{ runner.os }}
          path: ${{ steps.build.outputs.artifact_path }}
          retention-days: 30

  review-macos:
    name: Simulator and integrated UI (xcode-27)
    needs: verify-macos
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      REVIEW_INPUT_ARTIFACT_ID: ${{ needs.verify-macos.outputs.review-artifact-id }}
      REVIEW_INPUT_ARTIFACT_DIGEST: ${{ needs.verify-macos.outputs.review-artifact-digest }}
      REVIEW_INPUT_SHA256: ${{ needs.verify-macos.outputs.review-archive-sha256 }}
      REVIEW_PRODUCER_ATTEMPT: ${{ needs.verify-macos.outputs.producer-attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Record the independent Apple review environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/integrated
          xcodebuild -version | tee artifacts/integrated/review-environment.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/integrated/review-environment.txt | grep -E '^27\.'
          xcrun swiftc --version >> artifacts/integrated/review-environment.txt
          sw_vers >> artifacts/integrated/review-environment.txt
      # The immutable producer ID remains valid if only this job is rerun.
      # The manifest records producer and consumer attempts separately.
      - name: Require the specific producer ID and digest before downloading
        run: python3 Build/review_handoff.py check-request
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.verify-macos.outputs.review-artifact-id }}
          path: .build/integrated-input
          merge-multiple: true
      - name: Verify and restore the exact producer source, framework and phase evidence
        run: python3 Build/review_handoff.py restore .build/integrated-input/review-input.tar.gz
      - name: Provision the exact CPython cache required by the runtime checks
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.9'
          architecture: arm64
          check-latest: false
          update-environment: false
          allow-prereleases: false
          freethreaded: false
      - name: Actual integrated UI, saved intent and native response
        run: |
          set -euo pipefail
          runtime_observer_bind() {
            "$runtime_common_python" -B - "$runtime_common_source_root" "$runtime_common_source_commit" "$@" <<'HOST_OBSERVER_BINDING'
          import hashlib, pathlib, stat, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          relative = 'Build/observed_command_status.py'
          path = root / relative
          if not root.is_absolute() or root.resolve(strict=True) != root or path.is_symlink() or path.parent.is_symlink():
              raise SystemExit('Status reader must be an unlinked file in the exact source root')
          info = path.stat()
          if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o644 or info.st_nlink != 1 or info.st_size != 16072:
              raise SystemExit('Status reader file type, mode, links or size differs')
          raw = path.read_bytes()
          if len(raw) != 16072 or hashlib.sha256(raw).hexdigest() != 'f281d1f307e27d2b44d8436fa18a9c00a9fc9f43387e98ec49590ca910d837fb':
              raise SystemExit('Status reader bytes differ from the frozen reader')
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          entry = subprocess.run(['git', '-C', str(root), 'ls-tree', sys.argv[2], '--', relative], capture_output=True, timeout=10)
          if entry.returncode != 0 or entry.stderr != b'' or entry.stdout != ('100644 blob ' + blob + '\t' + relative + '\n').encode():
              raise SystemExit('Status reader is not tracked exactly by the actual source commit')
          sys.argv = [str(path), *sys.argv[3:]]
          exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          HOST_OBSERVER_BINDING
          }
          runtime_common_source_root="$(pwd -P)"
          runtime_common_source_commit="$(git rev-parse HEAD)"
          runtime_common_source_tree="$(git rev-parse 'HEAD^{tree}')"
          runtime_common_cache="${RUNNER_TOOL_CACHE:?}/Python/3.14.9/arm64"
          runtime_common_python="$runtime_common_cache/bin/python3.14"
          if [[ ! -f "${runtime_common_cache}.complete" || ! -x "$runtime_common_python" ]]; then
            printf 'Required completed CPython3.14.9 arm64 cache is unavailable.\n' >&2
            exit 1
          fi
          runtime_common_helper=Build/runtime_environment.py
          runtime_common_args=(--mode canonical --owner integrated
            --source-root "$runtime_common_source_root" --source-commit "$runtime_common_source_commit" --source-tree "$runtime_common_source_tree")
          runtime_common_args+=(--control-root "$runtime_common_source_root" --control-commit "$GITHUB_SHA" --control-tree "$runtime_common_source_tree")
          runtime_common_invoke() {
            "$runtime_common_python" "$runtime_common_helper" "$@" "${runtime_common_args[@]}"
          }
          # Capture real process status even under the original set -e discipline.
          if runtime_common_invoke prepare; then
            runtime_common_prepare_status=0
          else
            runtime_common_prepare_status=$?
          fi
          if runtime_common_invoke record-prepare-exit --actual-status "$runtime_common_prepare_status"; then
            runtime_common_record_status=0
          else
            runtime_common_record_status=$?
          fi
          if [ "$runtime_common_prepare_status" -ne 0 ]; then exit "$runtime_common_prepare_status"; fi
          if [ "$runtime_common_record_status" -ne 0 ]; then exit "$runtime_common_record_status"; fi
          runtime_common_invoke before --consumer integrated-ui
          runtime_observer_bind before integrated integrated-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
          runtime_observer_output="$runtime_common_source_root/artifacts/integrated/runtime-preparation/consumers/integrated-ui/host-observation"
          if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Build/ui_review.py > artifacts/integrated/ui-review.log 2>&1; then
            runtime_observer_actual_status=0
          else
            runtime_observer_actual_status=$?
          fi
          runtime_common_original_status=
          if runtime_common_original_status="$(runtime_observer_bind after integrated integrated-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
            runtime_observer_binding_status=0
          else
            runtime_observer_binding_status=$?
          fi
          if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
            if runtime_common_invoke after --consumer integrated-ui --actual-status "$runtime_common_original_status"; then
              runtime_common_after_status=0
            else
              runtime_common_after_status=$?
            fi
          else
            printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
            if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
            exit 1
          fi
          if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
          if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
          if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
          if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
      - name: Original and remapped Simulator installs, saved tabs and real TCP
        run: |
          set -euo pipefail
          runtime_observer_bind() {
            "$runtime_common_python" -B - "$runtime_common_source_root" "$runtime_common_source_commit" "$@" <<'HOST_OBSERVER_BINDING'
          import hashlib, pathlib, stat, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          relative = 'Build/observed_command_status.py'
          path = root / relative
          if not root.is_absolute() or root.resolve(strict=True) != root or path.is_symlink() or path.parent.is_symlink():
              raise SystemExit('Status reader must be an unlinked file in the exact source root')
          info = path.stat()
          if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o644 or info.st_nlink != 1 or info.st_size != 16072:
              raise SystemExit('Status reader file type, mode, links or size differs')
          raw = path.read_bytes()
          if len(raw) != 16072 or hashlib.sha256(raw).hexdigest() != 'f281d1f307e27d2b44d8436fa18a9c00a9fc9f43387e98ec49590ca910d837fb':
              raise SystemExit('Status reader bytes differ from the frozen reader')
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          entry = subprocess.run(['git', '-C', str(root), 'ls-tree', sys.argv[2], '--', relative], capture_output=True, timeout=10)
          if entry.returncode != 0 or entry.stderr != b'' or entry.stdout != ('100644 blob ' + blob + '\t' + relative + '\n').encode():
              raise SystemExit('Status reader is not tracked exactly by the actual source commit')
          sys.argv = [str(path), *sys.argv[3:]]
          exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          HOST_OBSERVER_BINDING
          }
          runtime_common_source_root="$(pwd -P)"
          runtime_common_source_commit="$(git rev-parse HEAD)"
          runtime_common_source_tree="$(git rev-parse 'HEAD^{tree}')"
          runtime_common_cache="${RUNNER_TOOL_CACHE:?}/Python/3.14.9/arm64"
          runtime_common_python="$runtime_common_cache/bin/python3.14"
          if [[ ! -f "${runtime_common_cache}.complete" || ! -x "$runtime_common_python" ]]; then
            printf 'Required completed CPython3.14.9 arm64 cache is unavailable.\n' >&2
            exit 1
          fi
          runtime_common_helper=Build/runtime_environment.py
          runtime_common_args=(--mode canonical --owner integrated
            --source-root "$runtime_common_source_root" --source-commit "$runtime_common_source_commit" --source-tree "$runtime_common_source_tree")
          runtime_common_args+=(--control-root "$runtime_common_source_root" --control-commit "$GITHUB_SHA" --control-tree "$runtime_common_source_tree")
          runtime_common_invoke() {
            "$runtime_common_python" "$runtime_common_helper" "$@" "${runtime_common_args[@]}"
          }
          runtime_common_invoke before --consumer integrated-simulator
          runtime_observer_bind before integrated integrated-simulator "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
          runtime_observer_output="$runtime_common_source_root/artifacts/integrated/runtime-preparation/consumers/integrated-simulator/host-observation"
          if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Build/simulator_review.py > artifacts/integrated/simulator-review.log 2>&1; then
            runtime_observer_actual_status=0
          else
            runtime_observer_actual_status=$?
          fi
          runtime_common_original_status=
          if runtime_common_original_status="$(runtime_observer_bind after integrated integrated-simulator "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
            runtime_observer_binding_status=0
          else
            runtime_observer_binding_status=$?
          fi
          if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
            if runtime_common_invoke after --consumer integrated-simulator --actual-status "$runtime_common_original_status"; then
              runtime_common_after_status=0
            else
              runtime_common_after_status=$?
            fi
          else
            printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
            if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
            exit 1
          fi
          if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
          if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
          if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
          if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
      - name: Remove the consumed product source
        if: always()
        run: rm -rf .build/integrated-product-source
      - name: Record exact source independently of generated products
        if: always()
        run: python3 Build/record_evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Integrated-review-macOS-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/integrated/
          retention-days: 30
