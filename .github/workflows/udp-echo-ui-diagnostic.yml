name: Compile current integrated XCUI sources without Simulator execution
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
  actions: read
jobs:
  compile_current_xcui_only:
    runs-on: xcode-27
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the actual diagnostic helper identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Verify actual v3 producer inputs and compile all four unchanged XCUI cases
        shell: bash
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B Bootstrap/ui_compile_diagnostic.py --fetch --compile \
            --output "$RUNNER_TEMP/current-xcui-compile-diagnostic"
      - name: Preserve actual compile result and separate producer provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Current-XCUI-compile-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-xcui-compile-diagnostic/diagnostic-result.json
            ${{ runner.temp }}/current-xcui-compile-diagnostic/actual-producer-api-metadata.json
            ${{ runner.temp }}/current-xcui-compile-diagnostic/native-product-identity.json
            ${{ runner.temp }}/current-xcui-compile-diagnostic/built-framework.json
            ${{ runner.temp }}/current-xcui-compile-diagnostic/generated-StatisticsUITests.swift
            ${{ runner.temp }}/current-xcui-compile-diagnostic/generated-test-project.pbxproj
            ${{ runner.temp }}/current-xcui-compile-diagnostic/xcode-version.txt
            ${{ runner.temp }}/current-xcui-compile-diagnostic/simulator-sdk-version.txt
            ${{ runner.temp }}/current-xcui-compile-diagnostic/build-for-testing.log
            ${{ runner.temp }}/current-xcui-compile-diagnostic/application/Socks5.xcodeproj/xcshareddata/xcschemes/StatisticsUIAudit.xcscheme
            ${{ runner.temp }}/current-xcui-compile-diagnostic/DerivedData/Build/Products/*.xctestrun
            control/Bootstrap/ui_compile_diagnostic.py
            control/.github/workflows/udp-echo-ui-diagnostic.yml
          if-no-files-found: error
          retention-days: 90
