name: Diagnose Background Audio intent once without release credit
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
  actions: read
jobs:
  background_audio_intent_diagnostic:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the actual independent diagnostic helper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Restore genuine Background inputs and run the original Audio case once with intent logging
        shell: bash
        working-directory: control
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B Bootstrap/background-audio-intent-diagnostic/run_diagnostic.py \
            --fetch --run-once --output "$RUNNER_TEMP/background-audio-intent-diagnostic"
      - name: Preserve actual original-case evidence and the separate instrumented identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: BG-Audio-intent-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/background-audio-intent-diagnostic/*.json
            ${{ runner.temp }}/background-audio-intent-diagnostic/*.log
            ${{ runner.temp }}/background-audio-intent-diagnostic/*.txt
            ${{ runner.temp }}/background-audio-intent-diagnostic/checkout/artifacts/audio-async-ui
            control/Bootstrap/background-audio-intent-diagnostic
            control/Bootstrap/runtime_handoff.py
            control/Bootstrap/ui_compile_diagnostic.py
            control/.github/workflows/udp-echo-ui-diagnostic.yml
          if-no-files-found: error
          retention-days: 90
