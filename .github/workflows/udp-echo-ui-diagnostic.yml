name: Bounded installed-Xcode 27.0 Simulator diagnostic
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  # One alternative supported configuration; the existing 27.1 control ran on another host.
  # An empty-device result provides no app, candidate, or sole-cause credit.
  simulator-runtime-comparison:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One pinned empty-device lifecycle with original deadlines
        shell: bash
        env:
          COMPARE_RUNTIME_VERSION: '27.0'
          COMPARE_RUNTIME_BUILD: '24A434'
          COMPARE_DEVICE_TYPE: 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'
        run: |
          set -euo pipefail
          python3 Bootstrap/simulator_runtime_compare.py \
            --runtime-version "$COMPARE_RUNTIME_VERSION" \
            --runtime-build "$COMPARE_RUNTIME_BUILD" \
            --device-type "$COMPARE_DEVICE_TYPE" \
            --output "$RUNNER_TEMP/simulator-runtime-comparison"
      - name: Preserve all actual diagnostic bytes including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Simulator-xcode27.0-pinned-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulator-runtime-comparison
          if-no-files-found: error
          retention-days: 90
