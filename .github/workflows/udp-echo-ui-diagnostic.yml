name: Observe fixed process waits without candidate credit
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  diagnose_process_wait_only:
    runs-on: xcode-27
    timeout-minutes: 3
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the actual diagnostic control identity
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 0
          persist-credentials: false
      - name: Observe each real interpreter once under the cached supervisor
        shell: bash
        working-directory: control
        run: |
          set -euo pipefail
          wait_cache_root="${RUNNER_TOOL_CACHE:?}"
          wait_cache_dir="$wait_cache_root/Python/3.14.9/arm64"
          wait_python314="$wait_cache_dir/bin/python3.14"
          wait_python315="$(command -v python3)"
          if [[ "$wait_cache_root" != /* || ! -f "${wait_cache_dir}.complete" || ! -x "$wait_python314" || "$wait_python315" != /* ]]; then
            printf '%s\n' 'Required existing interpreter/cache is unavailable.' >&2
            exit 1
          fi
          "$wait_python314" -B Bootstrap/process_wait_diagnostic.py supervise \
            --python314 "$wait_python314" --python315 "$wait_python315" \
            --output "$RUNNER_TEMP/process-wait-diagnostic"
      - name: Preserve all actual fixed-case observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Process-wait-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/process-wait-diagnostic
            control/Bootstrap/process_wait_diagnostic.py
            control/.github/workflows/udp-echo-ui-diagnostic.yml
          if-no-files-found: error
          retention-days: 90
