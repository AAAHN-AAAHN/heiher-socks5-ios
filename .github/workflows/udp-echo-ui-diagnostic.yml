name: Bounded Simulator supported-pair comparison
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  # Two separate jobs; verify actual host allocation from receipts, one pinned pair and one owned empty device per job.
  # Root merges this job into the existing helper diagnostic workflow.
  simulator-runtime-comparison:
    runs-on: xcode-27
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '27.0'
            build: '24A434'
            device_type: 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'
          - version: '27.1'
            build: '24A94425'
            device_type: 'com.apple.CoreSimulator.SimDeviceType.iPhone-Duo'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One pinned empty-device lifecycle with original deadlines
        shell: bash
        env:
          COMPARE_RUNTIME_VERSION: ${{ matrix.version }}
          COMPARE_RUNTIME_BUILD: ${{ matrix.build }}
          COMPARE_DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          set -euo pipefail
          python3 Bootstrap/simulator_runtime_compare.py \
            --runtime-version "$COMPARE_RUNTIME_VERSION" \
            --runtime-build "$COMPARE_RUNTIME_BUILD" \
            --device-type "$COMPARE_DEVICE_TYPE" \
            --output "$RUNNER_TEMP/simulator-runtime-comparison"
      - name: Preserve all actual diagnostic bytes including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Simulator-runtime-comparison-${{ matrix.version }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulator-runtime-comparison
          if-no-files-found: error
          retention-days: 90
