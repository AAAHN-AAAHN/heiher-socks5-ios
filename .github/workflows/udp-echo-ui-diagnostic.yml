name: Diagnose exact Background and Simulator failure boundaries
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  preparation:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Compare one exact preparation fixture with one observed copy
        run: python3 Bootstrap/diagnose_preparation_worker.py --repo . --output artifacts/preparation-diagnostic --mode debug
      - name: Verify causal preparation and explicit blocking rejection in both modes
        if: always()
        run: python3 Bootstrap/check_causal_preparation_worker.py --repo . --fixture Bootstrap/PreparationWorkerCausalTests.swift --output artifacts/causal-preparation-check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Preparation-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/preparation-diagnostic/
            artifacts/causal-preparation-check/
          if-no-files-found: error
          retention-days: 90
  simulator:
    runs-on: xcode-27
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Observe the fixed UI and production device lifecycle sequence
        run: python3 Bootstrap/simulator_lifecycle_probe.py --output artifacts/simulator-lifecycle-diagnostic
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Simulator-lifecycle-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/simulator-lifecycle-diagnostic/
          if-no-files-found: error
          retention-days: 90
