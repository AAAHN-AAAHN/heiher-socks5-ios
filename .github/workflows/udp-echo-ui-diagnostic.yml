name: Inspect exact legacy worker failure and declared causal fixture once
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  diagnose_legacy_once:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out the actual diagnostic control and full historical inputs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Execute the fixed original observed and declared causal matrix once
        shell: bash
        run: |
          set -euo pipefail
          legacy_cache_root="${RUNNER_TOOL_CACHE:?}"
          legacy_cache_dir="$legacy_cache_root/Python/3.14.9/arm64"
          legacy_python="$legacy_cache_dir/bin/python3.14"
          if [[ "$legacy_cache_root" != /* || ! -f "${legacy_cache_dir}.complete" || ! -x "$legacy_python" ]]; then
            printf '%s\n' 'FAIL: the existing completed CPython3.14.9 arm64 cache is required.' >&2
            exit 1
          fi
          "$legacy_python" -B - <<'PY'
          import platform, sys
          assert sys.implementation.name == 'cpython' and tuple(sys.version_info) == (3, 14, 9, 'final', 0)
          assert sys.platform == 'darwin' and platform.machine() == 'arm64' and __debug__
          PY
          "$legacy_python" -B Bootstrap/legacy-worker-diagnostic/diagnose_legacy_worker.py \
            --repo "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/legacy-worker-fixed-diagnostic"
      - name: Preserve every actual outcome including failures and exact inputs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Legacy-worker-fixed-diagnostic-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/legacy-worker-fixed-diagnostic
            ${{ github.workspace }}/Bootstrap/legacy-worker-diagnostic
          if-no-files-found: error
          retention-days: 90
