name: Stage one exact installed iOS disk image before the pinned Simulator lifecycle
on:
  push:
    branches: [work/udp-echo-udp-20261028]
permissions:
  contents: read
jobs:
  # One diagnostic run; NOTE_EXIT adds no application or candidate gate credit.
  # Different runner IDs alone do not prove different physical hosts.
  simulator-kernel-exit-observation:
    runs-on: xcode-27
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: One original empty-device lifecycle with independent exit observation
        shell: bash
        env:
          COMPARE_RUNTIME_VERSION: '27.0'
          COMPARE_RUNTIME_BUILD: '24A434'
          COMPARE_DEVICE_TYPE: 'com.apple.CoreSimulator.SimDeviceType.iPhone-16'
        run: |
          set -euo pipefail
          control_cache_root="${RUNNER_TOOL_CACHE:-}"
          if [[ -z "$control_cache_root" || "$control_cache_root" != /* ]]; then
            printf '%s\n' 'FAIL: RUNNER_TOOL_CACHE must identify the existing absolute tool-cache root.'
            exit 1
          fi
          control_cache_dir="$control_cache_root/Python/3.14.9/arm64"
          control_python="$control_cache_dir/bin/python3.14"
          if [[ ! -d "$control_cache_dir" || ! -f "${control_cache_dir}.complete" || ! -x "$control_python" ]]; then
            printf 'FAIL: required completed cache entry is unavailable: %s\n' "$control_cache_dir"
            exit 1
          fi
          printf 'Selected existing cache entry: %s\n' "$control_cache_dir"
          "$control_python" - <<'PY'
          import platform
          import sys
          if sys.implementation.name != 'cpython':
              raise SystemExit('FAIL: cached interpreter must be CPython.')
          if tuple(sys.version_info) != (3, 14, 9, 'final', 0):
              raise SystemExit(f'FAIL: expected CPython 3.14.9 final; observed {sys.version_info!r}.')
          if sys.platform != 'darwin' or platform.machine() != 'arm64':
              raise SystemExit('FAIL: cached interpreter must execute as Darwin arm64.')
          if not __debug__:
              raise SystemExit('FAIL: assertions must remain enabled.')
          print('PASS: cached CPython 3.14.9 final, Darwin arm64, assertions enabled. No lifecycle or application gate credit.')
          PY
          "$control_python" Bootstrap/ios_runtime_staged_preflight.py \
            --output "$RUNNER_TEMP/ios-runtime-staged-preflight"
          "$control_python" Bootstrap/simulator_runtime_compare.py \
            --runtime-version "$COMPARE_RUNTIME_VERSION" \
            --runtime-build "$COMPARE_RUNTIME_BUILD" \
            --device-type "$COMPARE_DEVICE_TYPE" \
            --output "$RUNNER_TEMP/simulator-runtime-comparison"
      - name: Preserve actual lifecycle and exit observations including failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Simulator-kernel-exit-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simulator-runtime-comparison
          if-no-files-found: error
          retention-days: 90
      - name: Preserve exact iOS staged-image preflight including rejection
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Simulator-iOS-runtime-staged-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ios-runtime-staged-preflight
          if-no-files-found: error
          retention-days: 90
