name: Build upstream Hev SOCKS5 IPA

on:
  push:
    branches:
      - build/hev-upstream-20260921
    paths:
      - .github/workflows/build-upstream-ipa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      APP_SHA: 180012e8b9dbaa2002a68ebd2c75bccebcfb789c
      CORE_SHA: b3585289622561caf4b8789b436cc8820ecd6be0
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout current upstream iOS app
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heiher/socks5-ios
          ref: ${{ env.APP_SHA }}
          path: app
          persist-credentials: false

      - name: Checkout current upstream server core
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: heiher/hev-socks5-server
          ref: ${{ env.CORE_SHA }}
          submodules: recursive
          path: core
          persist-credentials: false

      - name: Record source and toolchain versions
        run: |
          set -euo pipefail
          mkdir -p artifacts
          test "$(git -C app rev-parse HEAD)" = "$APP_SHA"
          test "$(git -C core rev-parse HEAD)" = "$CORE_SHA"
          {
            printf 'App repository: heiher/socks5-ios\nApp commit: %s\n' "$APP_SHA"
            printf 'Core repository: heiher/hev-socks5-server\nCore commit: %s\n' "$CORE_SHA"
            printf 'Workflow commit: %s\n' "$GITHUB_SHA"
            git -C core submodule status --recursive
            xcodebuild -version
            xcrun --sdk iphoneos --show-sdk-version
          } | tee artifacts/build-info.txt
          cp app/LICENSE artifacts/LICENSE-app.txt
          find core -not -path '*/.git/*' -type f \( -iname LICENSE -o -iname COPYING \) \
            -exec sh -c 'printf "\n--- %s ---\n" "$1"; cat "$1"' sh {} \; \
            > artifacts/LICENSES-core.txt

      - name: Build unmodified official Apple library
        run: |
          set -euo pipefail
          (cd core && ./build-apple.sh) 2>&1 | tee artifacts/core-build.log
          test -f core/HevSocks5Server.xcframework/Info.plist
          git -C core diff --exit-code
          git -C core submodule foreach --recursive 'git diff --exit-code'
          rm -rf app/HevSocks5Server.xcframework
          cp -R core/HevSocks5Server.xcframework app/HevSocks5Server.xcframework

      - name: Archive unmodified app without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project app/Socks5.xcodeproj \
            -scheme Socks5 \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$GITHUB_WORKSPACE/build/Socks5.xcarchive" \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee artifacts/app-build.log
          git -C app diff --exit-code -- . ':(exclude)HevSocks5Server.xcframework'

      - name: Package and verify unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p package/Payload
          ditto build/Socks5.xcarchive/Products/Applications/Socks5.app package/Payload/Socks5.app
          APP='package/Payload/Socks5.app'
          test -s "$APP/Socks5"
          plutil -lint "$APP/Info.plist"
          xcrun lipo "$APP/Socks5" -verify_arch arm64
          xcrun lipo -info "$APP/Socks5" | tee -a artifacts/build-info.txt
          xcrun otool -L "$APP/Socks5" > artifacts/linked-libraries.txt
          /usr/libexec/PlistBuddy -c Print "$APP/Info.plist" > artifacts/app-info-plist.txt
          (cd package && /usr/bin/zip -q -r ../artifacts/Socks5-unsigned.ipa Payload)
          unzip -t artifacts/Socks5-unsigned.ipa
          (cd artifacts && shasum -a 256 Socks5-unsigned.ipa > SHA256SUMS.txt)
          {
            printf '\nUnsigned IPA; sign with SideStore before installation.\n'
            printf 'App source and project: unchanged from the recorded upstream commit.\n'
            printf 'Core and submodule sources: unchanged from recorded commits.\n'
            printf 'Bundled XCFramework replaced only with the newly built upstream core.\n'
            printf 'No added plist permissions, background modes, or application features.\n'
          } >> artifacts/build-info.txt
          cp artifacts/build-info.txt "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA and build records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Socks5-upstream-unsigned
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
