name: Audit traffic statistics without IPA packaging
on:
  push:
    branches: [feature/traffic-statistics]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
permissions:
  contents: read
jobs:
  udp-prerequisite:
    uses: ./.github/workflows/udp-compat-audit.yml
    with:
      ref: 8f566f670d5c78beb0891cb146d5f16337651c78
  verify:
    needs: udp-prerequisite
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, xcode-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Prepare this audit output
        id: build
        run: python3 Tests/Statistics/audit.py --prepare
      - name: Install upstream formatter
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update -qq
            sudo apt-get install -y clang-format-18
          else
            brew install llvm@18
            mkdir -p "$RUNNER_TEMP/format-only"
            ln -s "$(brew --prefix llvm@18)/bin/clang-format" "$RUNNER_TEMP/format-only/clang-format-18"
            echo "$RUNNER_TEMP/format-only" >> "$GITHUB_PATH"
          fi
      - name: Record the actual iOS 27 toolchain
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/statistics-final-audit
          xcodebuild -version | tee artifacts/statistics-final-audit/toolchain.txt
          xcrun --sdk iphoneos --show-sdk-version | tee -a artifacts/statistics-final-audit/toolchain.txt | grep -E '^27\.'
          xcrun swiftc --version >> artifacts/statistics-final-audit/toolchain.txt
          sw_vers >> artifacts/statistics-final-audit/toolchain.txt
      - name: Verify statistics-only sources, native accounting and Swift types
        shell: bash
        run: python3 Tests/Statistics/audit.py
      - name: Provision the exact CPython cache required by the runtime checks
        if: runner.os == 'macOS' && hashFiles('Build/runtime_environment.py') != ''
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14.9'
          architecture: arm64
          check-latest: false
          update-environment: false
          allow-prereleases: false
          freethreaded: false
      - name: Exercise actual Server controls and tabs on iOS 27 Simulator
        env:
          DEVELOPER_DIR: /Applications/Xcode_27.app/Contents/Developer
          RUNTIME_COMMON_SOURCE_REF: ${{ inputs.ref }}
        if: runner.os == 'macOS'
        shell: bash
        id: ui
        run: |
          set -euo pipefail
          runtime_observer_bind() {
            "$runtime_common_python" -B - "$runtime_common_source_root" "$runtime_common_source_commit" "$@" <<'HOST_OBSERVER_BINDING'
          import hashlib, pathlib, stat, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          relative = 'Build/observed_command_status.py'
          path = root / relative
          if not root.is_absolute() or root.resolve(strict=True) != root or path.is_symlink() or path.parent.is_symlink():
              raise SystemExit('Status reader must be an unlinked file in the exact source root')
          info = path.stat()
          if not stat.S_ISREG(info.st_mode) or stat.S_IMODE(info.st_mode) != 0o644 or info.st_nlink != 1 or info.st_size != 16072:
              raise SystemExit('Status reader file type, mode, links or size differs')
          raw = path.read_bytes()
          if len(raw) != 16072 or hashlib.sha256(raw).hexdigest() != 'f281d1f307e27d2b44d8436fa18a9c00a9fc9f43387e98ec49590ca910d837fb':
              raise SystemExit('Status reader bytes differ from the frozen reader')
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          entry = subprocess.run(['git', '-C', str(root), 'ls-tree', sys.argv[2], '--', relative], capture_output=True, timeout=10)
          if entry.returncode != 0 or entry.stderr != b'' or entry.stdout != ('100644 blob ' + blob + '\t' + relative + '\n').encode():
              raise SystemExit('Status reader is not tracked exactly by the actual source commit')
          sys.argv = [str(path), *sys.argv[3:]]
          exec(compile(raw, str(path), 'exec'), {'__name__': '__main__', '__file__': str(path)})
          HOST_OBSERVER_BINDING
          }
          runtime_common_preparation_applied=1
          runtime_common_legacy_record_status=0
          runtime_common_after_status=0
          if [ -n "${RUNTIME_COMMON_SOURCE_REF:-}" ] && [ -z "$(git ls-tree HEAD -- Build/runtime_environment.py)" ]; then
            runtime_common_preparation_applied=0
          # Only an explicit original input whose Git tree lacks the new helper takes this path.
          # No downloaded helper, current consumer pin or preparation credit is substituted.
          if python3 - <<'RUNTIME_LEGACY_RECORD'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path.cwd()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}')}
          helper_entry = git('ls-tree', 'HEAD', '--', 'Build/runtime_environment.py')
          if not os.environ.get('RUNTIME_COMMON_SOURCE_REF') or helper_entry:
              raise SystemExit('Legacy fallback requires an explicit original input and an absent tracked helper path')
          out = root / 'artifacts/statistics-ui-audit/runtime-preparation'
          for item in (out / 'legacy-unavailable.json', out, *out.parents):
              if item.is_symlink():
                  raise SystemExit('Linked legacy preparation output is rejected: ' + str(item))
              if item == root:
                  break
          out.mkdir(parents=True, exist_ok=True)
          result = {'schema': 'legacy-explicit-input-preparation-unavailable-v1',
                    'result': 'PREPARATION_UNAVAILABLE_ORIGINAL_CONSUMER_STILL_REQUIRED',
                    'actual_input_ref': os.environ['RUNTIME_COMMON_SOURCE_REF'], 'source': source,
                    'helper_path': 'Build/runtime_environment.py', 'helper_git_entry': None,
                    'actual_caller_github_sha': os.environ['GITHUB_SHA'],
                    'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job': os.environ['GITHUB_JOB'],
                    'preparation_applied': False, 'formal_current_source_credit': False,
                    'hidden_helper_download': False,
                    'original_command': 'python3 Tests/Statistics/ui_audit.py',
                    'scope': 'The unchanged pinned checkout selected this explicit legacy input. This record neither claims a caller checkout nor replaces any original test or source check.'}
          with (out / 'legacy-unavailable.json').open('x') as stream:
              json.dump(result, stream, indent=2); stream.write('\n')
          RUNTIME_LEGACY_RECORD
          then
            runtime_common_legacy_record_status=0
          else
            runtime_common_legacy_record_status=$?
          fi
          else
            runtime_common_source_root="$(pwd -P)"
            runtime_common_source_commit="$(git rev-parse HEAD)"
            runtime_common_source_tree="$(git rev-parse 'HEAD^{tree}')"
            runtime_common_cache="${RUNNER_TOOL_CACHE:?}/Python/3.14.9/arm64"
            runtime_common_python="$runtime_common_cache/bin/python3.14"
            if [[ ! -f "${runtime_common_cache}.complete" || ! -x "$runtime_common_python" ]]; then
              printf 'Required completed CPython3.14.9 arm64 cache is unavailable.\n' >&2
              exit 1
            fi
            runtime_common_helper=Build/runtime_environment.py
            runtime_common_args=(--owner statistics
              --source-root "$runtime_common_source_root" --source-commit "$runtime_common_source_commit" --source-tree "$runtime_common_source_tree")
            if [ -n "${RUNTIME_COMMON_SOURCE_REF:-}" ]; then
              runtime_common_args+=(--mode workflow-input --workflow-input-ref "$RUNTIME_COMMON_SOURCE_REF")
            else
              runtime_common_args+=(--mode canonical --control-root "$runtime_common_source_root" --control-commit "$GITHUB_SHA" --control-tree "$runtime_common_source_tree")
            fi
            runtime_common_invoke() {
              "$runtime_common_python" "$runtime_common_helper" "$@" "${runtime_common_args[@]}"
            }
            # Capture real process status even under the original set -e discipline.
            if runtime_common_invoke prepare; then
              runtime_common_prepare_status=0
            else
              runtime_common_prepare_status=$?
            fi
            if runtime_common_invoke record-prepare-exit --actual-status "$runtime_common_prepare_status"; then
              runtime_common_record_status=0
            else
              runtime_common_record_status=$?
            fi
            if [ "$runtime_common_prepare_status" -ne 0 ]; then exit "$runtime_common_prepare_status"; fi
            if [ "$runtime_common_record_status" -ne 0 ]; then exit "$runtime_common_record_status"; fi
            runtime_common_invoke before --consumer statistics-ui
          fi
          # An explicit historical checkout may predate the observer, even if it has the common helper.
          runtime_observer_legacy_input=0
          if [ "$runtime_common_preparation_applied" -eq 0 ]; then
            runtime_observer_legacy_input=1
          elif [ -n "${RUNTIME_COMMON_SOURCE_REF:-}" ]; then
            runtime_observer_git_entry="$(git ls-tree HEAD -- Build/observe_host_during_command.py)"
            if [ -z "$runtime_observer_git_entry" ]; then
              runtime_observer_legacy_input=1
            else
              runtime_observer_reader_git_entry="$(git ls-tree HEAD -- Build/observed_command_status.py)"
              if [ -z "$runtime_observer_reader_git_entry" ]; then
                runtime_observer_legacy_input=1
              fi
            fi
          fi
          if [ "$runtime_observer_legacy_input" -eq 1 ]; then
            if python3 - "$runtime_common_preparation_applied" <<'HOST_OBSERVER_LEGACY'
          import json, os, pathlib, subprocess, sys
          root = pathlib.Path.cwd().resolve()
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          source = {'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}')}
          common_entry = git('ls-tree', 'HEAD', '--', 'Build/runtime_environment.py')
          observer_entry = git('ls-tree', 'HEAD', '--', 'Build/observe_host_during_command.py')
          reader_entry = git('ls-tree', 'HEAD', '--', 'Build/observed_command_status.py')
          applied = int(sys.argv[1])
          if not os.environ.get('RUNTIME_COMMON_SOURCE_REF') or applied not in (0, 1):
              raise SystemExit('Observation limitation requires an explicit earlier checkout')
          if (applied == 0 and common_entry) or (applied == 1 and (not common_entry or (observer_entry and reader_entry))):
              raise SystemExit('Historical common/observer availability differs from the exact Git checkout')
          out = root / 'artifacts/statistics-ui-audit/runtime-preparation'
          for item in (out / 'host-observation-unavailable.json', out, *out.parents):
              if item.is_symlink():
                  raise SystemExit('Linked historical observation output is rejected: ' + str(item))
              if item == root:
                  break
          out.mkdir(parents=True, exist_ok=True)
          record = {'schema': 'explicit-input-host-observation-unavailable-v1',
                    'result': 'OBSERVATION_UNAVAILABLE_ORIGINAL_CONSUMER_STILL_REQUIRED',
                    'actual_input_ref': os.environ['RUNTIME_COMMON_SOURCE_REF'], 'source': source,
                    'actual_caller_github_sha': os.environ['GITHUB_SHA'],
                    'repository': os.environ['GITHUB_REPOSITORY'], 'run_id': os.environ['GITHUB_RUN_ID'],
                    'attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'job': os.environ['GITHUB_JOB'],
                    'common_helper_git_entry': common_entry or None, 'observer_git_entry': observer_entry or None,
                    'status_reader_git_entry': reader_entry or None,
                    'common_preparation_applied': bool(applied), 'observation_applied': False,
                    'formal_current_source_credit': False, 'hidden_helper_download': False,
                    'original_command': 'python3 Tests/Statistics/ui_audit.py'}
          with (out / 'host-observation-unavailable.json').open('x') as stream:
              json.dump(record, stream, indent=2); stream.write('\n')
          HOST_OBSERVER_LEGACY
            then
              runtime_observer_legacy_record_status=0
            else
              runtime_observer_legacy_record_status=$?
            fi
            # Limitation recording must never replace or prevent the required original historical command.
            if python3 Tests/Statistics/ui_audit.py; then
              runtime_common_original_status=0
            else
              runtime_common_original_status=$?
            fi
            if [ "$runtime_common_preparation_applied" -eq 1 ]; then
              if runtime_common_invoke after --consumer statistics-ui --actual-status "$runtime_common_original_status"; then
                runtime_common_after_status=0
              else
                runtime_common_after_status=$?
              fi
            fi
            if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
            if [ "$runtime_common_legacy_record_status" -ne 0 ]; then exit "$runtime_common_legacy_record_status"; fi
            if [ "$runtime_observer_legacy_record_status" -ne 0 ]; then exit "$runtime_observer_legacy_record_status"; fi
            if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
          else
            runtime_observer_bind before statistics statistics-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree"
            runtime_observer_output="$runtime_common_source_root/artifacts/statistics-ui-audit/runtime-preparation/consumers/statistics-ui/host-observation"
            if "$runtime_common_python" -B "$runtime_common_source_root/Build/observe_host_during_command.py" --output "$runtime_observer_output" -- python3 Tests/Statistics/ui_audit.py; then
              runtime_observer_actual_status=0
            else
              runtime_observer_actual_status=$?
            fi
            runtime_common_original_status=
            if runtime_common_original_status="$(runtime_observer_bind after statistics statistics-ui "$runtime_common_source_root" "$runtime_common_source_commit" "$runtime_common_source_tree" "$runtime_observer_actual_status")"; then
              runtime_observer_binding_status=0
            else
              runtime_observer_binding_status=$?
            fi
            if [[ "$runtime_common_original_status" =~ ^(0|[1-9][0-9]{0,2})$ ]] && [ "$runtime_common_original_status" -le 255 ]; then
              if runtime_common_invoke after --consumer statistics-ui --actual-status "$runtime_common_original_status"; then
                runtime_common_after_status=0
              else
                runtime_common_after_status=$?
              fi
            else
              printf 'No trustworthy original exit status; no original-status after binding is claimed.\n' >&2
              if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
              exit 1
            fi
            if [ "$runtime_common_original_status" -ne 0 ]; then exit "$runtime_common_original_status"; fi
            if [ "$runtime_observer_actual_status" -ne 0 ]; then exit "$runtime_observer_actual_status"; fi
            if [ "$runtime_observer_binding_status" -ne 0 ]; then exit "$runtime_observer_binding_status"; fi
            if [ "$runtime_common_after_status" -ne 0 ]; then exit "$runtime_common_after_status"; fi
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.build.outputs.artifact_path != '' }}
        with:
          name: Statistics-final-audit-${{ runner.os }}
          path: ${{ steps.build.outputs.artifact_path }}
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && steps.ui.outcome != '' && steps.ui.outcome != 'skipped' }}
        with:
          name: Statistics-UI-${{ runner.os }}
          path: artifacts/statistics-ui-audit/
          retention-days: 30
